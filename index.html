<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>LifeGame</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090909;
  --card: #141413;
  --border: #303029;
  --text: #f4f3e9;
  --muted: #99998c;
  --accent: #ffda29;
  --green: #acd8b8;
}
* { box-sizing: border-box; }
html {
  touch-action: manipulation;
  scroll-padding-top: calc(80px + env(safe-area-inset-top, 0px));
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select, textarea { font: inherit; }
button, a, label, input, select, textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus:not(:focus-visible) { outline: none; }
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.app {
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: auto;
  padding:
    calc(78px + env(safe-area-inset-top, 0px))
    16px
    calc(110px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: fixed;
  z-index: 20;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  max-width: 480px;
  min-height: calc(58px + env(safe-area-inset-top, 0px));
  padding:
    calc(12px + env(safe-area-inset-top, 0px))
    16px 12px;
  background: #10100f;
  border-bottom: 1px solid #ffda2933;
  box-shadow: 0 5px 18px #0005;
}
.brand {
  flex-shrink: 0;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 2px;
}
#wallet {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: 14px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
#wallet span { white-space: nowrap; }
.wallet-diamonds { color: var(--green); }
h1 {
  margin: 0 0 10px;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: .5px;
  overflow-wrap: anywhere;
}
h2 {
  margin-top: 0;
  font-size: 20px;
  overflow-wrap: anywhere;
}
p { color: var(--muted); line-height: 1.45; }
.hero { padding-top: 10px; text-align: center; }
.motivation { width: calc(100% - 48px); max-width: 360px; margin: 0 auto 20px; text-align: center; }
.motivation-text { margin: 0; color: #e5e1d5; font-size: 16px; font-weight: 600; line-height: 23px; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
.motivation-text.collapsed { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; max-height: 92px; }
.motivation-expand { min-height: 44px; border: 0; background: transparent; color: #c5c5ba; text-decoration: underline; }
.motivation-measure { position: fixed; left: -10000px; visibility: hidden; pointer-events: none; }
.motivation-preview { max-width: 100%; margin: 12px auto; }
.avatar {
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  margin: 0 auto 20px;
  border: 1px solid #ffda2960;
  border-radius: 24px;
  background: linear-gradient(145deg, #34301a, #151510 70%);
  color: var(--accent);
  font-size: 42px;
  font-weight: 900;
}
.level { font-size: 23px; font-weight: 850; letter-spacing: 2px; }
.progress {
  height: 6px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 3px;
  background: #2b2b25;
}
.progress-fill { height: 100%; background: var(--accent); }
.hero .progress { margin-top: 16px; }
.progress-label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
}
.center { text-align: center; }
.card {
  position: relative;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: inset 3px 0 0 #ffda291a;
}
.balances-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-top: 22px;
}
.balance { min-width: 0; padding: 16px 10px; text-align: center; }
.balance-number {
  color: var(--accent);
  font-size: 30px;
  line-height: 1.1;
  font-weight: 850;
  overflow-wrap: anywhere;
}
.diamond-balance .balance-number { color: var(--green); }
.label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
}
.list { display: grid; gap: 10px; margin-top: 14px; }
.block {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  min-height: 56px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  text-align: left;
  font-size: 14px;
  font-weight: 600;
}
.block span:first-child { overflow-wrap: anywhere; }
.arrow { color: var(--accent); font-size: 23px; }
.back {
  min-height: 40px;
  margin-bottom: 10px;
  padding: 0 10px 0 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 13px;
}
.empty {
  margin-top: 16px;
  padding: 18px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.task-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-height: 36px;
  padding-right: 40px;
}
.task-title {
  flex: 1;
  min-width: 0;
  padding-top: 7px;
  font-size: 16px;
  line-height: 1.3;
  font-weight: 750;
  overflow-wrap: anywhere;
  white-space: normal;
}
.meta {
  margin: 5px 0 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}
.reward {
  margin: 8px 0 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 650;
}
.compact-details {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 7px 0 12px;
  font-size: 12px;
  line-height: 1.4;
}
.detail-muted { color: var(--muted); }
.detail-reward { color: var(--accent); font-weight: 650; }
.actions, .form-actions { display: flex; gap: 8px; }
.actions { margin-top: 10px; }
.actions > button { flex: 1; }
.form-actions { flex-wrap: wrap; margin-top: 24px; }
.button {
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid #ffda2970;
  border-radius: 8px;
  background: #ffda290c;
  color: var(--accent);
  font-size: 14px;
  font-weight: 650;
}
.full { width: 100%; }
.button.secondary {
  border-color: var(--border);
  background: transparent;
  color: var(--muted);
  font-weight: 500;
}
.button:active:not(:disabled), .block:active {
  background: #ffda291c;
}
.spaced { margin-top: 12px; }
.hero-link {
  margin-top: 18px;
  background: var(--accent);
  color: #111108;
  font-weight: 800;
}
.hero-link:active:not(:disabled) { background: #ebc817; }
.backup-link { margin-top: 22px; }
.summary-link { margin-top: 10px; }
.more-button {
  flex-shrink: 0;
  min-width: 36px;
  min-height: 36px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 24px;
}
.card.done {
  border-color: #38382b;
  background: #111110;
  box-shadow: inset 3px 0 0 #ffda2933;
}
.done .task-title { color: #c0c0b3; }
.done .detail-reward { color: #b9a84e; }
.section-label {
  margin-top: 22px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
}
.favorite-bar {
  position: absolute;
  top: 10px;
  right: 10px;
}
.favorite-button {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: #77776a;
  font-size: 24px;
}
.favorite-button.is-favorite {
  color: var(--accent);
  background: #ffda290b;
  border-color: #ffda2938;
}
.check-label {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  cursor: pointer;
}
.check-label input {
  flex: 0 0 20px;
  width: 20px;
  height: 20px;
  min-height: 20px;
  margin: 0;
  accent-color: var(--accent);
}
.quest-reward-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 6px 0 8px;
}
.quest-reward-line .compact-details { flex: 1; min-width: 0; margin: 0; }
.quest-plan-toggle {
  flex-shrink: 0;
  min-height: 36px;
  margin: 0;
  gap: 6px;
  font-size: 11px;
  white-space: nowrap;
}
.quest-plan-toggle input {
  flex-basis: 18px;
  width: 18px;
  height: 18px;
  min-height: 18px;
}
.block-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.block-heading h1 { flex: 1; min-width: 0; }
.block-create-actions { display: grid; gap: 10px; margin-top: 14px; }
.card.goal-card {
  border-color: #52765b;
  background: #142019;
  box-shadow: inset 3px 0 0 #79a985;
}
.active-goal { margin-top: 14px; }
.goal-card .task-head { padding-right: 0; }
.goal-label {
  color: #a4c9ae;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}
.goal-card .task-title { color: #e0eee3; }
.goal-card .reward { color: #a9dfb9; }
.goal-card .button, .button.goal-button {
  border-color: #89bd9770;
  background: #89bd9710;
  color: #c0e6ca;
}
.card.goal-card.done {
  background: #111a14;
  border-color: #3d5743;
  box-shadow: inset 3px 0 0 #52765b;
}
.goal-card .meta { color: #94af9b; }
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.summary-row:last-child { border-bottom: 0; }
.summary-row span { color: var(--muted); }
.summary-row strong { text-align: right; }
.summary-total { color: var(--accent); }
nav {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  width: 100%;
  max-width: 480px;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid #ffda292b;
  background: #10100f;
}
.nav-button {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  min-width: 0;
  min-height: 50px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #8f8f81;
  font-size: 10px;
}
.nav-icon { font-size: 20px; }
.nav-button.active {
  color: var(--accent);
  background: #ffda2910;
  box-shadow: inset 0 2px 0 var(--accent);
}
dialog {
  width: calc(100% - 32px);
  max-width: 440px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #ffda2940;
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
}
dialog::backdrop { background: #000b; }
label:not(.check-label) {
  display: block;
  margin: 18px 0 8px;
  color: var(--muted);
  font-size: 14px;
}
input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0c0c0b;
  color: var(--text);
  font-size: 16px;
}
textarea { min-height: 160px; max-height: 30vh; resize: vertical; }
.menu-actions { display: grid; gap: 10px; margin-top: 18px; }
.weekday-picker { min-width: 0; margin: 0; padding: 0; border: 0; }
.weekday-picker legend { margin-bottom: 12px; font-size: 14px; }
.weekday-presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.weekday-preset {
  min-height: 44px; padding: 8px; border: 1px solid var(--border);
  border-radius: 8px; background: #252524; color: var(--text); font-size: 13px;
}
.weekday-preset[aria-pressed="true"] { border-color: var(--accent); background: #ffda2918; color: var(--accent); }
.weekday-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
label.weekday-tile { position: relative; min-width: 0; margin: 0; cursor: pointer; }
.weekday-tile input {
  position: absolute; inset: 0; width: 100%; height: 100%; min-height: 44px;
  margin: 0; padding: 0; opacity: 0; cursor: pointer;
}
.weekday-tile span {
  display: flex; align-items: center; justify-content: center; min-height: 44px;
  padding: 8px 4px; border: 1px solid var(--border); border-radius: 8px;
  background: #252524; color: var(--text); font-size: 14px; font-weight: 700;
}
.weekday-tile input:checked + span { background: var(--accent); border-color: var(--accent); color: #090909; }
.weekday-tile input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
#backup-dialog > p { font-size: 13px; }
#backup-dialog .form-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-top: 14px;
}
#backup-dialog .form-actions button {
  min-width: 0;
  width: 100%;
  padding: 10px 8px;
  font-size: 13px;
}
#close-backup { grid-column: 1 / -1; }
.sound-setting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.sound-setting input {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  min-height: 0;
  padding: 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.sound-state {
  margin-left: auto;
  color: var(--muted);
  font-size: 12px;
}
.settings-danger {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.settings-danger h3 { margin: 0 0 8px; font-size: 14px; }
.settings-danger p { font-size: 12px; }
.button.danger {
  width: 100%;
  border-color: #ff797950;
  background: #ff797908;
  color: #ffaaaa;
}
#save-warning {
  color: #ffb4b4;
  font-size: 13px;
  line-height: 1.5;
}
.reward-toast {
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  display: grid;
  place-items: center;
  min-width: 210px;
  max-width: calc(100vw - 40px);
  min-height: 82px;
  padding: 18px 24px;
  border: 2px solid var(--accent);
  border-radius: 14px;
  background: #18180f;
  color: var(--accent);
  font-size: 25px;
  font-weight: 900;
  text-align: center;
  white-space: pre-line;
  line-height: 1.4;
  pointer-events: none;
  box-shadow: 0 0 0 9999px #0006, 0 0 35px #ffda2944;
  animation: reward-popup var(--duration, 1700ms) ease-out forwards;
}
.reward-toast.level-up,
.reward-toast.day-bonus-toast {
  min-width: 250px;
  background: #302b0d;
  color: #fff29a;
  border-color: #fff29a;
}
.reward-toast.goal-toast {
  min-width: 240px;
  background: #15271b;
  border-color: #96caa4;
  color: #c0e6ca;
  font-size: 23px;
}
@keyframes reward-popup {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.85); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
  24%, 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.97); }
}
@media (max-width: 390px) {
  .quest-reward-line { flex-direction: column; align-items: flex-start; gap: 3px; }
  .reward-toast { font-size: 21px; }
}
@media (max-width: 350px) {
  .brand { font-size: 10px; letter-spacing: 1px; }
  #wallet { font-size: 12px; gap: 4px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .reward-toast { animation-name: reward-fade; }
  @keyframes reward-fade {
    0%, 85% { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -50%); }
  }
}


/* Compact shared interface; no title truncation. */

.card:has(.favorite-bar) .task-head{padding-right:0}

.numeric-cell{min-width:0}.numeric-cell label{display:block;line-height:1.4}

.stage-row input{flex-shrink:0;width:44px;height:44px;min-height:44px;margin:0}

.stage-editor-row{min-width:0;margin:12px 0;padding:10px;border:1px solid var(--border);border-radius:12px}
.stage-editor-row .actions{margin-top:8px;display:grid;grid-template-columns:44px 44px minmax(0,1fr);gap:8px}
.stage-editor-row button{min-height:44px;padding:8px}
@media(max-width:350px){.numeric-row{grid-template-columns:minmax(0,1fr)}}
</style>
<style>
  .card.diamond-shop-card {
    border-color: #52765b;
    box-shadow: inset 3px 0 0 #79a98555;
  }

  .diamond-shop-card .reward {
    color: var(--green);
  }

  .diamond-shop-card .button:not(.secondary) {
    border-color: #89bd9770;

<script>
"use strict";

(() => {
  const STORAGE_KEY = "lifegame-prototype-v1";
  const MIN_DAY_TASKS = 3;
  const DAY_REWARD = 100;
  const LEVEL_COST = 1000;
  const TREAT_CATEGORIES = ["Движение", "Спокойствие", "Удовольствие", "Общение", "Другое"];
  const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  const DEFAULT_MOTIVATION = "Ради чего ты действуешь? Напиши свою мотивацию — или скрой этот текст в настройках.";

  const DEFAULT_NAMES = [
    "Душевное состояние",
    "Физическое состояние",
    "Знания, навыки, опыт",
    "Ресурсы и материальное",
    "Окружение и отношения",
    "Наполнение и организация",
    "Обстоятельства",
    "Исключить"
  ];

  const $ = id => document.getElementById(id);
  const screen = $("screen");
  const wallet = $("wallet");
  const warning = $("save-warning");
  const editor = $("editor");
  const menu = $("menu");
  const settings = $("backup-dialog");
  const backupText = $("backup-text");
  const backupStatus = $("backup-status");
  const soundToggle = $("sound-enabled");
  const soundState = $("sound-state");

  let state = emptyState();
  let snapshot = null;
  let healthy = true;
  let page = "hero";
  let calendarDate = today();
  let calendarMonth = today().slice(0, 7);
  let calendarMode = "days";
  let calendarPast = false;
  let blockId = null;
  let view;
  let audioContext = null;
  const activeSounds = new Map();
  const effects = [];
  let effectRunning = false;
  let effectTimer = null;

  function emptyState() {
    return {
      soundEnabled: true,
      motivationEnabled: true,
      motivationText: "",
      blocks: DEFAULT_NAMES.map((name, index) => ({
        id: "block-" + index, name
      })),
      goals: [],
      diamondRecords: [],
      tasks: [],
      quests: [],
      bonuses: [],
      completions: [],
      calendarEntries: [],
      calendarCompletions: [],
      purchases: [],
      treats: [],
      treatUses: [],
      focus: {status:"ready", id:null, minutes:5, name:"", remaining:300000, endsAt:null, notified:true, natural:false},
      dayPlans: {},
      dayPlanDate: null
    };
  }

  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function fail(message) { throw new Error(message); }
  function integer(value, min, max) {
    return Number.isSafeInteger(value) && value >= min && value <= max;
  }
  function validId(value) {
    return typeof value === "string" && value.length > 0;
  }
  function validName(value) {
    return typeof value === "string" &&
      value.trim().length > 0 && value.length <= 120;
  }
  function uid() {
    if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return Array.from(
      crypto.getRandomValues(new Uint8Array(16)),
      value => value.toString(16).padStart(2, "0")
    ).join("");
  }
  function dateKey(date = new Date()) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }
  function today() { return dateKey(); }
  function dateLabel() {
    return new Date().toLocaleDateString("ru-RU", {
      day: "numeric", month: "long"
    });
  }
  function validDate(value) {
    if (typeof value !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const date = new Date(value + "T12:00:00Z");
    return Number.isFinite(date.getTime()) &&
      date.toISOString().slice(0, 10) === value;
  }
  function sum(list, key) {
    return list.reduce((total, item) => total + item[key], 0);
  }
    function totals(data) {
    const earned = sum(data.completions, "reward");

    const spent = sum(
      data.purchases.filter(
        purchase => purchase.currency !== "diamonds"
      ),
      "price"
    );

    const diamondsEarned = sum(data.diamondRecords, "amount");

    const diamondsSpent = sum(
      data.purchases.filter(
        purchase => purchase.currency === "diamonds"
      ),
      "price"
    );

    return {
      earned,
      spent,
      balance: earned - spent,
      diamondsEarned,
      diamondsSpent,
      diamonds: diamondsEarned - diamondsSpent
    };
  }

  // Проверка данных и перенос старых числовых блоков.
  function normalize(raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw) ||
        !Array.isArray(raw.tasks) || !Array.isArray(raw.completions)) {
      fail("Неверная структура сохранения.");
    }

    const data = clone(raw);
    if (data.motivationEnabled === undefined) data.motivationEnabled = true;
    if (data.motivationText === undefined) data.motivationText = "";
    if (typeof data.motivationEnabled !== "boolean" ||
        typeof data.motivationText !== "string" || data.motivationText.length > 120) {
      fail("Некорректная личная мотивация.");
    }
    if (data.soundEnabled === undefined) data.soundEnabled = true;
    if (typeof data.soundEnabled !== "boolean") {
      fail("Некорректная настройка звуков.");
    }

    if (data.blocks === undefined) {
      data.blocks = emptyState().blocks;
      for (const task of data.tasks) {
        if (integer(task.block, 0, 7)) task.block = "block-" + task.block;
      }
    }

    for (const key of [
      "quests", "bonuses", "purchases", "goals", "diamondRecords", "calendarEntries", "calendarCompletions", "treats", "treatUses"
    ]) {
      if (data[key] === undefined) data[key] = [];
    }

    for (const key of [
      "blocks", "tasks", "quests", "bonuses", "purchases",
      "completions", "goals", "diamondRecords", "calendarEntries", "calendarCompletions", "treats", "treatUses"
    ]) {
      if (!Array.isArray(data[key])) fail("Повреждён список: " + key);
      const ids = new Set();
      for (const item of data[key]) {
        if (!item || typeof item !== "object" ||
            !validId(item.id) || ids.has(item.id)) {
          fail("Повреждены записи: " + key);
        }
        ids.add(item.id);
      }
    }

    for (const item of data.treats) {
      // Validation of treats remains independent of the focus timer.
      if (!validName(item.name) || typeof item.description !== "string" ||
          item.description.length > 500 ||
          (item.duration !== null && !integer(item.duration, 1, 180)) ||
          !TREAT_CATEGORIES.includes(item.category) || typeof item.favorite !== "boolean") {
        fail("Повреждены данные ништяка.");
      }
    }
    for (const use of data.treatUses) {
      if (!validId(use.treatId) || !validName(use.name) ||
          typeof use.usedAt !== "string" || !Number.isFinite(Date.parse(use.usedAt))) {
        fail("Повреждена история ништяков.");
      }
    }
    if (data.focus === undefined) data.focus = emptyState().focus;
    const f = data.focus;
    if (!f || typeof f !== "object" || !["ready","running","paused","completed"].includes(f.status) ||
        !integer(f.minutes,1,180) || typeof f.name !== "string" || f.name.length > 120 ||
        !integer(f.remaining,0,f.minutes*60000) || typeof f.notified !== "boolean" || typeof f.natural !== "boolean" ||
        (f.status === "ready" ? f.id !== null : !validId(f.id)) ||
        (f.status === "running" ? !integer(f.endsAt,1,8640000000000000) : f.endsAt !== null) ||
        (f.status === "paused" && f.remaining === 0) ||
        (f.status === "ready" && (f.remaining !== f.minutes*60000 || !f.notified || f.natural)) ||
        (["running","paused"].includes(f.status) && f.natural) ||
        (f.status === "completed" && (f.remaining !== 0 || (!f.natural && !f.notified)))) fail("Повреждены данные таймера.");
        const blocks = new Set();

    for (const item of data.blocks) {
      if (!validName(item.name)) {
        fail("Некорректное название блока.");
      }

      // В существующих блоках смысл изначально пустой.
      if (item.meaning === undefined) {
        item.meaning = "";
      }

      if (
        typeof item.meaning !== "string" ||
        item.meaning.length > 2000
      ) {
        fail("Некорректный текст смысла блока.");
      }

      item.meaning = item.meaning.trim();

      blocks.add(item.id);
    }

    function bool(item, key) {
      if (item[key] === undefined) item[key] = false;
      if (typeof item[key] !== "boolean") fail("Некорректное поле: " + key);
    }

    for (const task of data.tasks) {
      if (!validName(task.name) || !blocks.has(task.block) ||
          !["once", "daily"].includes(task.type) ||
          !integer(task.reward, 1, 100000)) {
        fail("Повреждены данные задания.");
      }
      bool(task, "favorite");
      if (task.weekdays === undefined) {
        task.weekdays = task.type === "daily" ? [1, 2, 3, 4, 5, 6, 7] : [];
      }
      if (!Array.isArray(task.weekdays) ||
          !task.weekdays.every(day => integer(day, 1, 7)) ||
          new Set(task.weekdays).size !== task.weekdays.length) {
        fail("Повреждено расписание задания.");
      }
      task.weekdays.sort((a, b) => a - b);
      task.type = task.weekdays.length ? "daily" : "once";
    }

    const recordKeys = new Set();
    for (const record of data.completions) {
      if (record.taskType !== undefined && !["once", "daily", "legacy"].includes(record.taskType)) fail("Повреждён тип выполнения задания.");
      if (!validId(record.taskId) || !validDate(record.date) ||
          !integer(record.reward, 1, 100000)) {
        fail("Повреждена история монет.");
      }
      const key = JSON.stringify([record.taskId, record.date]);
      if (recordKeys.has(key)) fail("Повторное начисление монет.");
      recordKeys.add(key);

      if (record.sourceCompletionIds !== undefined &&
          (!Array.isArray(record.sourceCompletionIds) ||
           !record.sourceCompletionIds.every(validId) ||
           new Set(record.sourceCompletionIds).size !==
             record.sourceCompletionIds.length)) {
        fail("Повреждены связи бонуса дня.");
      }
    }

    const recordsById = new Map(data.completions.map(x => [x.id, x]));
    const calendarFacts = new Map(data.calendarCompletions.map(x => [x.id, x]));
    const calendarIds = new Set();
    const calendarPayments = new Set();
    for (const fact of data.calendarCompletions) {
      if (!validId(fact.entryId) || calendarIds.has(fact.entryId) ||
          !validCalendarDate(fact.date) || !integer(fact.reward, 0, 100000)) fail("Повреждена история календаря.");
      calendarIds.add(fact.entryId);
      if (fact.reward === 0) {
        if (fact.coinRecordId !== null) fail("У записи без награды есть начисление.");
      } else {
        const payment = recordsById.get(fact.coinRecordId);
        if (!payment || calendarPayments.has(payment.id) || payment.taskId !== "calendar:" + fact.entryId ||
            payment.date !== fact.date || payment.reward !== fact.reward) fail("Повреждена связь календаря с монетами.");
        calendarPayments.add(payment.id);
      }
    }
    for (const entry of data.calendarEntries) {
      bool(entry, "favorite");
      if (!validName(entry.name) || !validCalendarDate(entry.date) ||
          typeof entry.time !== "string" || (entry.time !== "" && !/^([01]\d|2[0-3]):[0-5]\d$/.test(entry.time)) ||
          typeof entry.note !== "string" || entry.note.length > 1000 || !integer(entry.reward, 0, 100000)) fail("Повреждена запись календаря.");
      const fact = calendarFacts.get(entry.completionId);
      if (entry.completionId === null ? calendarIds.has(entry.id) :
          !fact || fact.entryId !== entry.id || fact.reward !== entry.reward) fail("Повреждена связь выполнения календаря.");
    }
    for (const payment of data.completions) {
      if (payment.taskId.startsWith("calendar:") && !calendarPayments.has(payment.id)) fail("Начисление календаря без выполнения.");
    }

    for (const quest of data.quests) {
      if (quest.type === undefined) quest.type = "counter";
      if (!["counter", "stages"].includes(quest.type)) fail("Неизвестный тип квеста.");
      if (quest.type === "stages") {
        normalizeStages(quest, data);
        continue;
      }
      if (!validName(quest.name) ||
          !integer(quest.target, 1, 1000000) ||
          !integer(quest.progress, 0, quest.target) ||
          !integer(quest.step, 1, 1000000) ||
          !integer(quest.reward, 1, 100000)) {
        fail("Повреждены данные квеста.");
      }
      bool(quest, "favorite");
      bool(quest, "showInDay");
      if (quest.stepReward === undefined) quest.stepReward = 0;
      if (quest.stepHistory === undefined) quest.stepHistory = [];
      if (quest.legacyProgress === undefined) quest.legacyProgress = quest.stepHistory.length ? quest.stepHistory[0].from : quest.progress;
      if (quest.started === undefined) quest.started = quest.progress > 0 || quest.stepHistory.length > 0 || data.completions.some(x => x.taskId === "quest:" + quest.id || x.taskId.startsWith("quest:step:" + quest.id + ":"));
      bool(quest, "started");
      if (!integer(quest.legacyProgress, 0, quest.target)) fail("Повреждена граница истории квеста.");
      if (!integer(quest.stepReward, 0, 100000) ||
          !Array.isArray(quest.stepHistory)) fail("Повреждена история квеста.");

      let previousTo = null;
      const paymentIds = new Set();
      for (const entry of quest.stepHistory) {
        if (!entry || !integer(entry.from, 0, quest.target) ||
            !integer(entry.to, 1, quest.target) ||
            entry.to <= entry.from ||
            (previousTo !== null && entry.from !== previousTo)) {
          fail("Нарушена последовательность шагов.");
        }
        previousTo = entry.to;
        if (entry.completionId === undefined) entry.completionId = null;
        if (entry.completionId !== null) {
          const payment = recordsById.get(entry.completionId);
          if (!payment || paymentIds.has(entry.completionId) ||
              payment.taskId !==
                `quest:step:${quest.id}:${entry.completionId}`) {
            fail("Повреждена связь шага с наградой.");
          }
          paymentIds.add(entry.completionId);
        }
      }
      if (quest.stepHistory.length && previousTo !== quest.progress) {
        fail("История не соответствует прогрессу квеста.");
      }
    }

    for (const bonus of data.bonuses) {
            if (bonus.currency === undefined) {
        bonus.currency = "coins";
      }

      if (!["coins", "diamonds"].includes(bonus.currency)) {
        fail("Некорректная валюта бонуса.");
      }
      if (bonus.description === undefined) bonus.description = "";
      if (!validName(bonus.name) ||
          typeof bonus.description !== "string" ||
          bonus.description.length > 300 ||
          !integer(bonus.price, 1, 1000000)) fail("Повреждены данные бонуса.");
      bool(bonus, "favorite");
    }

    for (const purchase of data.purchases) {
            if (purchase.currency === undefined) {
        purchase.currency = "coins";
      }

      if (!["coins", "diamonds"].includes(purchase.currency)) {
        fail("Некорректная валюта покупки.");
      }
      if (!validName(purchase.name) || !validId(purchase.bonusId) ||
          !integer(purchase.price, 1, 1000000) ||
          typeof purchase.createdAt !== "string" ||
          !Number.isFinite(Date.parse(purchase.createdAt))) {
        fail("Повреждена история покупок.");
      }
    }

    const activeBlocks = new Set();
    for (const goal of data.goals) {
      if (goal.completedDate === undefined) goal.completedDate = null;
      if (!validName(goal.name) || !blocks.has(goal.blockId) ||
          !integer(goal.diamonds, 1, 100000) ||
          (goal.completedDate !== null && !validDate(goal.completedDate))) {
        fail("Повреждены данные цели.");
      }
      if (goal.completedDate === null) {
        if (activeBlocks.has(goal.blockId)) {
          fail("В блоке может быть только одна активная цель.");
        }
        activeBlocks.add(goal.blockId);
      }
    }

    const diamondGoals = new Map();
    for (const record of data.diamondRecords) {
      if (!validId(record.goalId) || !validDate(record.date) ||
          !integer(record.amount, 1, 100000) ||
          diamondGoals.has(record.goalId)) {
        fail("Повреждена история алмазов.");
      }
      diamondGoals.set(record.goalId, record);
    }

    for (const goal of data.goals) {
      const reward = diamondGoals.get(goal.id);
      if (goal.completedDate === null && reward) {
        fail("У активной цели уже начислена награда.");
      }
      if (goal.completedDate !== null &&
          (!reward || reward.amount !== goal.diamonds ||
           reward.date !== goal.completedDate)) {
        fail("Награда цели не соответствует истории.");
      }
    }

    if (data.dayPlans === undefined) data.dayPlans = {};
    if (!data.dayPlans || typeof data.dayPlans !== "object" ||
        Array.isArray(data.dayPlans)) fail("Повреждены планы дня.");
    for (const [date, ids] of Object.entries(data.dayPlans)) {
      if (!validDate(date) || !Array.isArray(ids) ||
          !ids.every(validId) || new Set(ids).size !== ids.length) {
        fail("Повреждён план дня.");
      }
    }
    if (data.dayPlanDate === undefined) data.dayPlanDate = null;
    if (data.dayPlanDate !== null && !validDate(data.dayPlanDate)) {
      fail("Некорректная дата плана.");
    }
    const planDates = Object.keys(data.dayPlans).filter(date => date <= today()).sort();
    const migrationDate = Object.hasOwn(data.dayPlans, today()) ? today()
      : planDates[planDates.length - 1];
    const migrationIds = new Set(data.dayPlans[migrationDate] || []);
    for (const task of data.tasks) {
      if (task.inDayBuilder === undefined) {
        task.inDayBuilder = task.type === "daily" && migrationIds.has(task.id);
      }
      bool(task, "inDayBuilder");
    }

        const money = totals(data);

    const amounts = [
      money.earned,
      money.spent,
      money.balance,
      money.diamondsEarned,
      money.diamondsSpent,
      money.diamonds
    ];

    if (!amounts.every(
      value => Number.isSafeInteger(value) && value >= 0
    )) {
      fail("Некорректный баланс монет или алмазов.");
    }

    return data;
  }

  function storageError(message) {
    healthy = false;
    warning.hidden = false;
    warning.textContent = message;
  }

  function loadLatest() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw !== snapshot) {
        const loaded = raw === null ? emptyState() : normalize(JSON.parse(raw));
        state = loaded;
        syncSoundSetting();
        snapshot = raw;
      }
      return true;
    } catch (error) {
      storageError("Не удалось прочитать данные. Не очищай хранилище. " +
        error.message);
      return false;
    }
  }

  function ensureDay(data) {
    const date = today();
    const ids = new Set(data.dayPlans[date] || []);
    data.dayPlans[date] = data.tasks.filter(task => task.type === "daily"
      ? task.inDayBuilder && scheduledToday(task) : ids.has(task.id)).map(task => task.id);
    data.dayPlanDate = date;
  }

  function scheduledToday(task) {
    return !task.weekdays.length || task.weekdays.includes(new Date().getDay() || 7);
  }

  function plannedTasks(data) {
    const ids = new Set(data.dayPlans[today()] || []);
    return data.tasks.filter(task => ids.has(task.id) && scheduledToday(task));
  }

  function completion(data, task, todayOnly = false) {
    if (task.historySeparated !== undefined && typeof task.historySeparated !== "boolean") fail("Повреждена граница истории задания.");
    return [...data.completions].reverse().find(record =>
      record.taskId === task.id &&
      (record.date === today() || (!todayOnly && task.type === "once" &&
        (record.taskType === "once" || (record.taskType === undefined && task.historySeparated !== true))))
    );
  }

  function addRecord(data, taskId, reward, extra = {}) {
    const now = new Date();
    const record = { id: uid(), taskId, date: dateKey(now), completedAt: now.toISOString(), reward, ...extra };
    data.completions.push(record);
    return record;
  }

  function reconcileDayBonus(data) {
    const ids = new Set(data.completions.map(x => x.id));
    data.completions = data.completions.filter(record =>
      !record.taskId.startsWith("day-bonus:") ||
      !Array.isArray(record.sourceCompletionIds) ||
      record.sourceCompletionIds.every(id => ids.has(id))
    );

    const key = "day-bonus:" + today();
    if (data.completions.some(x => x.taskId === key)) return;
    const tasks = plannedTasks(data);
    if (tasks.length < MIN_DAY_TASKS) return;
    const records = tasks.map(task => completion(data, task, true));
    if (records.some(x => !x)) return;
    addRecord(data, key, DAY_REWARD, {
      sourceCompletionIds: records.map(x => x.id)
    });
  }

  function transact(change, awardDayBonus = true, selfCare = false) {
    if (!healthy) {
      alert("Изменения отключены из-за ошибки хранилища.");
      return false;
    }

    try {
      if (localStorage.getItem(STORAGE_KEY) !== snapshot) {
        loadLatest();
        render();
        alert("Данные изменились в другой вкладке. Повтори действие.");
        return false;
      }
    } catch (error) {
      storageError("Хранилище недоступно: " + error.message);
      render();
      return false;
    }

    const before = totals(state);
    const beforeIds = new Set(state.completions.map(x => x.id));
    let next;

    try {
      const draft = clone(state);
      if (!selfCare) ensureDay(draft);
      change(draft);
      if (awardDayBonus) reconcileDayBonus(draft);
            const money = totals(draft);

      if (money.balance < 0) {
        fail(
          "Эти монеты уже потрачены. " +
          "Сначала отмени соответствующие покупки."
        );
      }

      if (money.diamonds < 0) {
        fail(
          "Эти алмазы уже потрачены. " +
          "Сначала отмени соответствующие покупки."
        );
      }

      next = normalize(draft);
    } catch (error) {
      alert(error.message);
      render();
      return false;
    }

    try {
      const serialized = JSON.stringify(next);
      localStorage.setItem(STORAGE_KEY, serialized);
      snapshot = serialized;
      state = next;
    } catch (error) {
      storageError("Сохранение не удалось. Действие не применено. " +
        error.message);
      render();
      return false;
    }

    // Ошибки эффектов не должны объявлять успешную запись неудачной.
    render();
    try {
      if (!selfCare) celebrateChanges(before, beforeIds);
    } catch (error) {
      console.warn("Эффект награды недоступен:", error);
    }
    return true;
  }

  function syncDay() {
    if (healthy && (state.dayPlanDate !== today() ||
        !Object.hasOwn(state.dayPlans, today()))) {
      transact(() => {}, false);
    }
  }

  // Звуки и последовательные уведомления.
  function syncSoundSetting() {
    soundToggle.checked = state.soundEnabled;
    soundState.textContent = state.soundEnabled ? "Включены" : "Выключены";
    soundToggle.disabled = !healthy;
    if (state.soundEnabled) return;
    for (const [oscillator, gain] of activeSounds) {
      gain.disconnect();
      try {
        oscillator.stop();
      } catch (error) {
        console.warn("Остановка звука недоступна:", error);
      }
    }
    activeSounds.clear();
  }

  function primeAudio() {
    if (!state.soundEnabled) return;
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      if (!audioContext) audioContext = new Audio();
      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }
    } catch (error) {
      console.warn("Аудио недоступно:", error);
    }
  }

  function tones(frequencies, interval = .12, duration = .25, volume = .12) {
    if (!state.soundEnabled) return;
    try {
      primeAudio();
      if (!audioContext) return;
      const now = audioContext.currentTime;
      frequencies.forEach((frequency, index) => {
        const start = now + interval * index;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        activeSounds.set(oscillator, gain);
        oscillator.onended = () => {
          activeSounds.delete(oscillator);
          oscillator.disconnect();
          gain.disconnect();
        };
        oscillator.start(start);
        oscillator.stop(start + duration + .03);
      });
    } catch (error) {
      console.warn("Звук недоступен:", error);
    }
  }

  function enqueueEffect(type, value) {
    primeAudio();
    effects.push({ type, value });
    runEffect();
  }

  function runEffect() {
    if (effectRunning || !effects.length || document.hidden) return;
    effectRunning = true;

    const event = effects.shift();
    const toast = el("div", "reward-toast");
    let duration = 1700;

    if (event.type === "coins") {
      toast.textContent = `+${event.value} монет`;
      tones([880, 1175, 1480], .07, .16);
    } else if (event.type === "day") {
      duration = 4000;
      toast.classList.add("day-bonus-toast");
      toast.textContent = `★ БОНУС ДНЯ\n+${event.value} МОНЕТ`;
      tones([523.25, 659.25, 783.99, 1046.5], .14, .5, .14);
    } else if (event.type === "goal") {
      duration = 2800;
      toast.classList.add("goal-toast");
      toast.textContent = `✓ ЦЕЛЬ ДОСТИГНУТА\n+${event.value} ◆`;
      tones([659.25, 783.99, 1046.5], .16, .45, .13);
    } else if (event.type === "level") {
      duration = 3600;
      toast.classList.add("level-up");
      toast.textContent = `★ УРОВЕНЬ ${event.value}`;
      tones([523.25, 659.25, 783.99, 1046.5], .15, .45, .14);
    }

    toast.style.setProperty("--duration", duration + "ms");
    document.body.append(toast);

    effectTimer = setTimeout(() => {
      toast.remove();
      effectRunning = false;
      runEffect();
    }, duration + 100);
  }

  function clearEffects() {
    effects.length = 0;
    clearTimeout(effectTimer);
    effectRunning = false;
    document.querySelectorAll(".reward-toast").forEach(x => x.remove());
  }

  function celebrateChanges(before, beforeIds) {
    const after = totals(state);
    const bonus = state.completions.find(record =>
      !beforeIds.has(record.id) && record.taskId.startsWith("day-bonus:")
    );
    const regular = after.earned - before.earned - (bonus ? bonus.reward : 0);
    if (regular > 0) enqueueEffect("coins", regular);
    if (bonus) enqueueEffect("day", bonus.reward);
        const diamondsAwarded =
      after.diamondsEarned - before.diamondsEarned;

    if (diamondsAwarded > 0) {
      enqueueEffect("goal", diamondsAwarded);
    }
    const oldLevel = Math.floor(before.earned / LEVEL_COST) + 1;
    const newLevel = Math.floor(after.earned / LEVEL_COST) + 1;
    if (newLevel > oldLevel) enqueueEffect("level", newLevel);
  }

  // Общие элементы интерфейса.
  function el(tag, className = "", text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function btn(text, className, action, mutating = false) {
    const node = el("button", className, text);
    node.type = "button";

        ];
        const updatePresets = () => {
          choices.forEach(([, days], index) => {
            const matches = checks.every((input, day) =>
              input.checked === days.includes(day + 1));

          });

          input.addEventListener("change", updatePresets);

          grid.append(label);
          return input;
        });
        choices.forEach(([text, days]) => {
          presets.append(btn(text, "weekday-preset", () => {
            checks.forEach((input, index) => { input.checked = days.includes(index + 1); });
            updatePresets();
          }));
        });
        updatePresets();
        group.append(presets, grid);
        inputs[field.key] = checks;
        form.append(group, el("p", "meta", "Не выбраны дни — разовое задание"));

      }
      if(field.key === "currency") {
        const group=el("fieldset","currency-picker");group.append(el("legend","",field.label));
        const select=el("select");select.hidden=true;select.id="edit-currency";
        for(const [value,text] of field.options){const option=el("option","",text);option.value=value;select.append(option);
          const label=el("label",value);const radio=el("input");radio.type="radio";radio.name="currency";radio.value=value;radio.checked=value===field.value;
          radio.addEventListener("change",()=>select.value=value);label.append(radio,el("span","",text));group.append(label);}
        select.value=field.value;inputs[field.key]=select;group.append(select);form.append(group);continue;

      input.id = id;

        for (const [value, text] of field.options) {
          const option = el("option", "", text);
          option.value = value;
          input.append(option);
        }
      } else {
        if (field.type !== "textarea") input.type = field.type || "text";
        for (const key of ["min", "max", "step", "maxLength"]) {
          if (field[key] !== undefined) input[key] = field[key];
        }
      }
      input.required = field.required !== false;
      input.disabled = !!field.disabled;
      input.value = String(field.value ?? "");
      inputs[field.key] = input;
      if(field.type === "number") {
        let row=form.lastElementChild;

      if (actual.completedDate !== null) {
        if (data.goals.some(x =>
          x.id !== id && x.blockId === actual.blockId &&
          x.completedDate === null

          fail("В блоке уже есть активная цель. Сначала заверши или удали её.");

        data.diamondRecords = data.diamondRecords.filter(x => x.goalId !== id);

  // Отдельный календарь. Даты не преобразуются через UTC.
  function localCalendarDate(value) {
    const [y, m, d] = value.split("-").map(Number);
    const result = new Date(2000, m - 1, d, 12);
    result.setFullYear(y);
    return result;
  }
  function validCalendarDate(value) {
    return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
      value.slice(0, 4) !== "0000" && dateKey(localCalendarDate(value)) === value;
  }
  function sortCalendar(entries) {
    return [...entries].sort((a,b)=>Number(!!a.completionId)-Number(!!b.completionId) || Number(!!b.favorite)-Number(!!a.favorite) || (a.time||"99:99").localeCompare(b.time||"99:99"));
  }
  function calendarLabel(value) {
    return localCalendarDate(value).toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"});
  }
  function editCalendar(id = null) {
    const entry = id ? state.calendarEntries.find(x => x.id === id) : null;
    if (id && !entry) return;
    const locked = !!entry?.completionId;
    openForm(entry ? "Изменить запись" : "Событие или дело", [
      nameField(entry?.name),
      {key:"date", label:"Дата", type:"date", value:entry?.date || (calendarMode === "all" ? today() : calendarDate), disabled:locked},
      {key:"time", label:"Время", type:"time", value:entry?.time || "", required:false, disabled:locked},
      {key:"note", label:"Заметка", type:"textarea", value:entry?.note || "", required:false, maxLength:1000},
      {...numberField("reward", "Награда в монетах", entry?.reward || 0, 100000, 0), disabled:locked,
        hint:locked ? "0 — без награды. Для изменения даты, времени и награды сначала отмени выполнение." : "0 — без награды"}
    ], values => transact(data => {
      if (!id) data.calendarEntries.push({id:uid(), ...values, completionId:null, favorite:false});
      else {
        const actual = data.calendarEntries.find(x => x.id === id);
        if (!actual) fail("Запись не найдена.");
        if (actual.completionId !== null && (values.date !== actual.date || values.time !== actual.time || values.reward !== actual.reward)) fail("Сначала отмени выполнение.");
        Object.assign(actual, values);
      }
    }, false), entry ? "Сохранить" : "Создать");
  }
  function completeCalendar(id, done) {
    if (!done && !confirm("Отменить выполнение? Связанная награда будет возвращена, если монеты ещё не потрачены.")) return;
    return transact(data => {

  function moveQuest(id, direction) {
    if(state.quests.find(x=>x.id===id)?.type==="stages")return;
    if (direction < 0 && !confirm(
      "Отменить последнее продвижение? Его награда, а при необходимости " +
      "и награда за достижение, будут убраны."
    )) return;

    transact(data => {
      const quest = data.quests.find(x => x.id === id);
      if (!quest) fail("Квест не найден.");
      const last = quest.stepHistory[quest.stepHistory.length - 1];
      if(direction < 0 && !last && quest.progress > 0) fail("Для старого прогресса история шагов не сохранена. Отменить можно только новые продвижения");
      if(direction > 0) quest.started = true;
      const next = direction > 0
        ? Math.min(quest.target, quest.progress + quest.step)
        : last && last.to === quest.progress
          ? last.from : Math.max(0, quest.progress - quest.step);

      if (next === quest.progress) return;

      if (direction > 0) {
        let paymentId = null;
        if (quest.stepReward > 0) {
          paymentId = uid();
          addRecord(data, `quest:step:${id}:${paymentId}`,
            quest.stepReward, { id: paymentId });
        }
        quest.stepHistory.push({
          from: quest.progress, to: next, completionId: paymentId, completedAt: new Date().toISOString()
        });
      } else if (last && last.to === quest.progress) {
        quest.stepHistory.pop();
        if (last.completionId) {
          data.completions = data.completions.filter(x => x.id !== last.completionId);
        }
      }

      quest.progress = next;
      const final = data.completions.find(x => x.taskId === "quest:" + id);
      if (next === quest.target && !final) {
        addRecord(data, "quest:" + id, quest.reward);
      }
      if (next < quest.target && final) {
        data.completions = data.completions.filter(x => x.id !== final.id);
      }
    }, false);
  }

  function buildView() {
    const date = today();
    const anyTask = new Map();
    const todayTask = new Map();
    const recordsToday = [];
    for (const record of state.completions) {
      const task = state.tasks.find(x => x.id === record.taskId);
      if (!task || completion(state, task)?.id === record.id) anyTask.set(record.taskId, record);

      plannedDone: planned.filter(x => todayTask.has(x.id)),
      bonus: todayTask.get("day-bonus:" + date),
      money: totals(state)

    const measure = el("p", "motivation-text motivation-measure", text);

    const block = el("div", "motivation");

    let expanded = false;
    const toggle = btn("Показать полностью", "motivation-expand", () => {

      toggle.textContent = expanded ? "Свернуть" : "Показать полностью";
      toggle.setAttribute("aria-expanded", String(expanded));
    });
    toggle.setAttribute("aria-controls", text.id);
    toggle.setAttribute("aria-expanded", "false");
    const update = () => { toggle.hidden = !motivationOverflows(text.textContent, block.clientWidth); };
    block.append(text, toggle);
    const observer = new ResizeObserver(update);
    observer.observe(block);
    motivationObserver?.disconnect();
    motivationObserver = observer;
    return block;
  }

  function editMotivation() {
    if (!healthy || !loadLatest()) return;
    settings.close();
    editor.replaceChildren();
    const form = el("form");
    form.append(el("h2", "", "Личная мотивация"));
    const show = checkbox("Показывать мотивацию", state.motivationEnabled, () => {});
    const enabled = show.querySelector("input");
    const label = el("label", "", "Своя фраза");
    label.htmlFor = "motivation-input";
    const input = el("textarea");
    input.id = label.htmlFor;
    input.maxLength = 120;
    input.value = state.motivationText;
    const hint = el("p", "meta", "Пустое поле — текст по умолчанию. До 120 символов и 4 строк на главной.");
    hint.id = "motivation-hint";
    input.setAttribute("aria-describedby", hint.id + " motivation-count");
    const count = el("div", "meta");
    count.id = "motivation-count";
    const preview = el("p", "motivation-text motivation-preview");
    preview.style.width = motivationWidth() + "px";
    const previewObserver = new ResizeObserver(() => {
      preview.style.width = motivationWidth() + "px";
    });
    previewObserver.observe(screen);
    preview.setAttribute("aria-label", "Предпросмотр");
    const error = el("p", "meta");
    error.setAttribute("role", "alert");
    const update = () => {
      count.textContent = `${input.value.length} / 120`;
      preview.textContent = input.value.trim() || DEFAULT_MOTIVATION;
      preview.hidden = !enabled.checked;
      error.textContent = "";
    };
    input.addEventListener("input", update);
    enabled.addEventListener("change", update);
    const reset = btn("Вернуть текст по умолчанию", "button secondary full", () => {
      input.value = "";
      update();
    });
    const actions = el("div", "form-actions");
    const save = el("button", "button", "Сохранить");
    save.type = "submit";
    actions.append(btn("Отмена", "button secondary", () => editor.close()), save);
    form.append(show, label, input, hint, count, preview, reset, error, actions);
    form.addEventListener("submit", event => {
      event.preventDefault();
      const phrase = input.value.trim();
      if (input.value.length > 120 || (enabled.checked && motivationOverflows(phrase || DEFAULT_MOTIVATION))) {
        error.textContent = "Сократи текст: не больше 120 символов и 4 строк при текущей ширине главной.";
        input.focus();
        return;
      }
      if (transact(data => {
        data.motivationEnabled = enabled.checked;
        data.motivationText = phrase;
      }, false)) editor.close();
    });
    editor.addEventListener("close", () => {
      previewObserver.disconnect();
      settings.showModal();
    }, { once: true });
    editor.append(form);
    update();
    editor.showModal();
    input.focus();
  }

  const treatReelSymbols = ["☕", "♪", "♥", "☀"];

  function buildTreatReels(spinning = false) {
    const reels = el(
      "div",
      "treat-machine-reels" + (spinning ? " is-spinning" : "")
    );
    reels.setAttribute("aria-hidden", "true");

    for (let index = 0; index < 3; index++) {
      const reel = el("div", "treat-machine-reel");
      const strip = el("div", "treat-machine-reel-strip");

      if (spinning) {
        for (let repeat = 0; repeat < 2; repeat++) {
          for (let offset = 0; offset < treatReelSymbols.length; offset++) {
            strip.append(el(
              "div",
              "treat-machine-reel-item",
              treatReelSymbols[
                (offset + index) % treatReelSymbols.length
              ]
            ));
          }
        }
      } else {
        strip.append(el(
          "div",
          "treat-machine-reel-item",
          treatMachineReelResult[index]
        ));
      }

      reel.append(strip);
      reels.append(reel);
    }

    return reels;
  }

  function rollTreatReelResult() {
    const symbols = [...treatReelSymbols];

    for (let index = symbols.length - 1; index > 0; index--) {
      const other = Math.floor(Math.random() * (index + 1));
      [symbols[index], symbols[other]] =
        [symbols[other], symbols[index]];
    }

    const result = symbols.slice(0, 3);

    // Не повторяем точно ту же комбинацию подряд.
    if (result.every(
      (symbol, index) => symbol === treatMachineReelResult[index]
    )) {
      [result[0], result[1]] = [result[1], result[0]];
    }

    treatMachineReelResult = result;
  }

  function treatMachineCard() {
    const machine = el("section", "treat-machine");
    machine.setAttribute("aria-label", "Автомат ништяков");

    const head = el("div", "treat-machine-head");
    const lamp = el("span", "treat-machine-lamp");
    lamp.setAttribute("aria-hidden", "true");

    head.append(
      el("h2", "treat-machine-title", "Автомат ништяков"),
      lamp
    );

    const display = el("div", "treat-machine-window");

    const announcement = el(
      "div",
      "treat-machine-announcement"
    );
    announcement.setAttribute("role", "status");
    announcement.setAttribute("aria-atomic", "true");

    // Фильтры ручного списка не влияют на автомат.
    const pool = () => state.treats;

    let issuing = false;
    let reelSoundTimer = null;

    function stopReelSound() {
      window.clearTimeout(reelSoundTimer);
      reelSoundTimer = null;
    }

    function startReelSound() {
      stopReelSound();
      if (!state.soundEnabled || document.hidden) return;

      primeAudio();
      const startedAt = performance.now();
      let tickIndex = 0;

      const tick = () => {
        reelSoundTimer = null;

        if (
          !issuing ||
          !machine.isConnected ||
          page !== "treats" ||
          document.hidden ||
          !state.soundEnabled
        ) return;

        const elapsed = performance.now() - startedAt;
        if (elapsed >= 3000) return;

        // Короткие мягкие тики, не очередь звуков на три секунды.
        tones(
          [tickIndex % 2 === 0 ? 440 : 554.37],
          .01,
          .045,
          .025
        );
        tickIndex++;

        // Ближе к выдаче ритм немного замедляется.
        const delay = elapsed < 2100 ? 125 : 210;
        reelSoundTimer = window.setTimeout(tick, delay);
      };

      tick();
    }

    const issue = btn(
      "Выдать ништяк",
      "button full treat-machine-primary spaced",
      () => {
        if (issuing || !machine.isConnected) return;

        const items = pool();
        if (!items.length) return;

        const alternatives = items.length > 1
          ? items.filter(
              item => item.id !== treatMachineSelectedId
            )
          : items;

        const chosen = alternatives[
          Math.floor(Math.random() * alternatives.length)
        ];
        const showResult = () => {
          stopReelSound();

          // После ухода со страницы или общей перерисовки
          // старая карточка не должна менять новый экран.
          if (
            !machine.isConnected ||
            page !== "treats"
          ) return;

          issuing = false;

          // За время анимации запись могла быть удалена
          // или отредактирована. Используем актуальный список.
          const actual = pool().find(
            item => item.id === chosen.id
          );

          treatMachineSelectedId = actual ? actual.id : null;
          if (actual) rollTreatReelResult();
          draw(true);

          if (actual && !document.hidden) {
            tones(
              [523.25, 783.99, 1046.5, 1318.51],
              .09,
              .28,
              .055
            );
          }

          announcement.textContent = actual
            ? "Твой ништяк: " + actual.name
            : "Ништяк больше недоступен. Попробуй ещё раз.";
        };

        issuing = true;
        issue.disabled = true;
        issue.textContent = "Выдаём…";
        announcement.textContent = "";

        const search = el("div", "treat-machine-search");
        search.setAttribute("aria-hidden", "true");

        search.append(
          buildTreatReels(true),
          el(
            "div",
            "treat-machine-search-text",
            "Ищем маленькую радость…"
          )
        );

        display.replaceChildren(search);
        startReelSound();

        // Единственная короткая задержка.
        // Callback выше проверяет живость именно этой карточки.
        window.setTimeout(showResult, 3000);
      }
    );

    function draw(animate = false) {
      const items = pool();
      const selected = items.find(
        item => item.id === treatMachineSelectedId
      );

      if (!selected) treatMachineSelectedId = null;

      display.replaceChildren();
      issue.hidden = state.treats.length === 0;
      issue.disabled = items.length === 0;
      issue.textContent = selected
        ? "Другой вариант"
        : "Выдать ништяк";

      if (selected) {
        const ticket = el(
          "div",
          "treat-machine-ticket" +
            (animate ? " is-new" : "")
        );

        ticket.append(
          el(
            "div",
            "treat-machine-ticket-label",
            "ТВОЙ НИШТЯК"
          ),
          el("h3", "", selected.name)
        );

        if (selected.description) {
          ticket.append(el(
            "p",
            "treat-machine-description",
            selected.description
          ));
        }

        const meta = [selected.category];
        if (selected.duration !== null) {
          meta.push(selected.duration + " мин");
        }

        ticket.append(
          el(
            "div",
            "treat-machine-meta",
            meta.join(" · ")
          ),
          btn("Выбрать", "button full", () => {
            const chosenId = selected.id;

            if (!state.treats.some(
              item => item.id === chosenId
            )) {
              treatMachineSelectedId = null;
              announcement.textContent = "";
              draw();
              return;
            }

            treatMachineSelectedId = null;
            draw();
            announcement.textContent = "Ништяк выбран. Приятного отдыха!";

            tones(
              [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5],
              .11,
              .32,
              .065
            );
          })
        );

        display.append(ticket);
        return;
      }

      const idle = el("div", "treat-machine-idle");
      const symbol = buildTreatReels();

      idle.append(
        symbol,
        el(
          "div",
          "treat-machine-message",
          !state.treats.length
            ? "Автомат пока пуст"
            : "Что приятного сегодня?"
        )
      );

      if (!state.treats.length) {
        idle.append(
          el(
            "p",
            "treat-machine-note",
            "Наполни его тем, что радует именно тебя."

          btn(
            "Добавить первый ништяк",
            "button full spaced",
            () => treatForm(),
            true
          )
        );
      }

      display.append(idle);
    }

    const slot = el("div", "treat-machine-slot");

    machine.append(
      head,

        "treat-machine-caption",
        "Радость без повода"

      announcement,
      issue,
      slot,
      el(
        "div",
        "treat-machine-footer",
        "Монетки не нужны"

    draw();
    return machine;
  }
