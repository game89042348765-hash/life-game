<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>LifeGame</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #09090d;
    --card: #14141d;
    --border: #292936;
    --text: #f4f4fa;
    --muted: #9595a8;
    --accent: #62f5d1;
    --gold: #edcf83;
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top:
      calc(80px + env(safe-area-inset-top, 0px));
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button, input, select, textarea { font: inherit; }

  button { cursor: pointer; }

  button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .app {
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: auto;
    padding:
      calc(88px + env(safe-area-inset-top, 0px))
      20px
      calc(110px + env(safe-area-inset-bottom, 0px));
  }

  .topbar {
    position: fixed;
    z-index: 20;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 480px;
    min-height: calc(64px + env(safe-area-inset-top, 0px));
    padding:
      calc(14px + env(safe-area-inset-top, 0px))
      20px
      14px;
    background: #101017;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 24px #00000026;
  }

  .brand {
    white-space: nowrap;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--muted);
  }

  #wallet {
    flex-shrink: 0;
    white-space: nowrap;
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 27px;
    overflow-wrap: anywhere;
  }

  h2 { font-size: 21px; }

  p {
    color: var(--muted);
    line-height: 1.6;
  }

  .hero {
    padding-top: 24px;
    text-align: center;
  }

  .avatar {
    display: grid;
    place-items: center;
    width: 142px;
    height: 142px;
    margin: 0 auto 30px;
    border: 1px solid #65517e;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 20%, #49305e, #171720 70%);
    box-shadow: 0 0 35px #a66cff12;
    color: var(--accent);
    font-size: 44px;
    font-weight: 800;
  }

  .level {
    font-size: 24px;
    font-weight: 750;
    letter-spacing: 2px;
  }

  .progress {
    height: 7px;
    margin-top: 20px;
    overflow: hidden;
    border-radius: 20px;
    background: #252532;
  }

  .progress-fill {
    height: 100%;
    background:
      linear-gradient(90deg, #9280ff, var(--accent));
  }

  .progress-label {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
  }

  .center { text-align: center; }

  .card {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
  }

  .balance {
    margin-top: 24px;
    text-align: center;
  }

  .hero .balance { margin-top: 34px; }

  .balance-number {
    color: var(--accent);
    font-size: 44px;
    font-weight: 750;
    overflow-wrap: anywhere;
  }

  .label {
    margin-top: 6px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
  }

  .list {
    display: grid;
    gap: 12px;
    margin-top: 24px;
  }

  .block {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 64px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    text-align: left;
  }

  .arrow, .reward { color: var(--accent); }

  .back {
    min-height: 44px;
    margin-bottom: 16px;
    padding: 0 10px 0 0;
    border: 0;
    background: transparent;
    color: var(--accent);
  }

  .empty {
    margin-top: 24px;
    padding: 24px;
    border: 1px dashed var(--border);
    border-radius: 18px;
    color: var(--muted);
    line-height: 1.7;
  }

  .task-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .task-title {
    font-size: 17px;
    font-weight: 650;
    overflow-wrap: anywhere;
  }

  .meta {
    margin: 8px 0 14px;
    color: var(--muted);
    font-size: 13px;
  }

  .reward { margin-bottom: 16px; }

  .actions, .form-actions {
    display: flex;
    gap: 10px;
  }

  .actions { margin-top: 18px; }
  .actions > button { flex: 1; }

  .form-actions {
    flex-wrap: wrap;
    margin-top: 24px;
  }

  .button {
    min-height: 46px;
    padding: 12px 16px;
    border: 1px solid var(--accent);
    border-radius: 12px;
    background: #62f5d10b;
    color: var(--accent);
  }

  .full { width: 100%; }

  .secondary {
    border-color: var(--border);
    background: transparent;
    color: var(--muted);
  }

  .small {
    padding: 8px 12px;
    font-size: 12px;
  }

  .spaced { margin-top: 16px; }
  .hero-link { margin-top: 24px; }
  .backup-link { margin-top: 28px; }
  .summary-link { margin-top: 12px; }

  .delete {
    flex-shrink: 0;
    min-width: 44px;
    min-height: 44px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 20px;
  }

  .done { border-color: #62f5d13b; }

  .section-label {
    margin-top: 28px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }

  .favorite-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  .favorite-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-size: 25px;
  }

  .is-favorite {
    border-color: #edcf8355;
    background: #edcf8309;
    color: var(--gold);
  }

  .check-label {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }

  .check-label input {
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    min-height: 22px;
    margin: 0;
    accent-color: var(--accent);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 18px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .summary-row:last-child { border-bottom: 0; }
  .summary-row span { color: var(--muted); }

  .summary-row strong {
    text-align: right;
    white-space: nowrap;
  }

  .summary-total { color: var(--accent); }

  nav {
    position: fixed;
    z-index: 10;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 100%;
    max-width: 480px;
    padding:
      10px 8px
      calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: #101017;
  }

  .nav-button {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    min-width: 0;
    min-height: 54px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
  }

  .nav-icon { font-size: 21px; }

  .nav-button.active {
    background: #62f5d10a;
    color: var(--accent);
  }

  dialog {
    width: calc(100% - 32px);
    max-width: 440px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    color: var(--text);
  }

  dialog::backdrop { background: #000b; }

  label:not(.check-label) {
    display: block;
    margin: 18px 0 8px;
    color: var(--muted);
    font-size: 14px;
  }

  input, select, textarea {
    width: 100%;
    min-height: 48px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }

  textarea {
    min-height: 180px;
    resize: vertical;
  }

  #save-warning {
    color: #ffb4b4;
    font-size: 13px;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: no-preference) {
    .progress-fill { transition: width .2s ease; }
  }
</style>
<style>
  /* ===== LIFE / GAME — BLACK & YELLOW ===== */

  :root {
    --bg: #090909;
    --card: #141413;
    --border: #303029;
    --text: #f4f3e9;
    --muted: #99998c;
    --accent: #ffda29;
    --gold: #ffda29;
  }

  body {
    background: var(--bg);
  }

  .app {
    padding-left: 16px;
    padding-right: 16px;
    padding-top: calc(
      78px + env(safe-area-inset-top, 0px)
    );
  }

  /* Верхняя панель */

  .topbar {
    min-height: calc(
      58px + env(safe-area-inset-top, 0px)
    );

    padding:
      calc(12px + env(safe-area-inset-top, 0px))
      16px
      12px;

    background: #10100f;
    border-bottom: 1px solid #ffda2933;
    box-shadow: 0 5px 18px #0005;
  }

  .brand {
    color: var(--text);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: 2px;
  }

  #wallet {
    color: var(--accent);
    font-size: 16px;
    font-weight: 800;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: .5px;
  }

  h2 {
    font-size: 20px;
  }

  p {
    line-height: 1.45;
  }

  /* Карточки: компактные игровые панели */

  .card {
    position: relative;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    box-shadow: inset 3px 0 0 #ffda291a;
  }

  .list {
    gap: 10px;
    margin-top: 14px;
  }

  .task-head {
    align-items: flex-start;
    gap: 8px;

    /* Справа оставляем место для звезды. */
    min-height: 36px;
    padding-right: 40px;
  }

  .task-title {
    flex: 1;
    min-width: 0;
    padding-top: 7px;
    font-size: 16px;
    line-height: 1.3;
    font-weight: 750;
  }

  /* Звезда больше не занимает отдельную строку */

  .favorite-bar {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    display: block;
    margin: 0;
  }

  .favorite-button {
    width: 40px;
    height: 40px;
    min-height: 40px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: #77776a;
    font-size: 24px;
  }

  .favorite-button.is-favorite {
    color: var(--accent);
    background: #ffda290b;
    border-color: #ffda2938;
  }

  .delete {
    min-width: 36px;
    min-height: 36px;
    padding: 0;
    color: #818175;
    font-size: 20px;
  }

  .meta {
    margin: 5px 0 8px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
  }

  .reward {
    margin: 8px 0 10px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.35;
  }

  /* Кнопки */

  .button {
    min-height: 44px;
    padding: 10px 13px;
    border: 1px solid #ffda2970;
    border-radius: 8px;
    background: #ffda290c;
    color: var(--accent);
    font-size: 14px;
    font-weight: 650;
  }

  .button.secondary {
    border-color: var(--border);
    background: transparent;
    color: var(--muted);
    font-weight: 500;
  }

  .button.small {
    min-height: 36px;
    padding: 7px 9px;
    border-color: transparent;
    background: #ffffff04;
    font-size: 11px;
    font-weight: 500;
  }

  .button:active:not(:disabled),
  .block:active {
    background: #ffda291c;
  }

  .actions {
    gap: 8px;
    margin-top: 10px;
  }

  /* Прогресс */

  .progress {
    height: 6px;
    margin-top: 12px;
    border-radius: 3px;
    background: #2b2b25;
  }

  .progress-fill {
    background: var(--accent);
    box-shadow: 0 0 8px #ffda2926;
  }

  .progress-label {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
  }

  /* Галочки */

  .check-label {
    gap: 10px;
    min-height: 44px;
    margin: 7px 0 0;
    font-size: 12px;
    line-height: 1.35;
  }

  .check-label input {
    flex-basis: 20px;
    width: 20px;
    height: 20px;
    min-height: 20px;
    accent-color: var(--accent);
  }

  /* Выполненные карточки не конкурируют с активными */

  .card.done {
    border-color: #38382b;
    background: #111110;
    box-shadow: inset 3px 0 0 #ffda2933;
  }

  .done .task-title {
    color: #c0c0b3;
  }

  .done .reward {
    color: #b9a84e;
  }

  .section-label {
    margin-top: 22px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
  }

  /* Блоки времени */

  .block {
    min-height: 56px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--card);
    font-size: 14px;
    font-weight: 600;
  }

  .arrow {
    color: var(--accent);
    font-size: 23px;
  }

  .back {
    min-height: 40px;
    margin-bottom: 10px;
    color: var(--accent);
    font-size: 13px;
  }

  /* Главная */

  .hero {
    padding-top: 10px;
  }

  .avatar {
    width: 112px;
    height: 112px;
    margin-bottom: 20px;
    border: 1px solid #ffda2960;
    border-radius: 24px;
    background:
      linear-gradient(145deg, #34301a, #151510 70%);
    box-shadow:
      inset 0 0 20px #ffda2905,
      0 0 24px #ffda2907;
    color: var(--accent);
    font-size: 42px;
    font-weight: 900;
  }

  .level {
    color: var(--text);
    font-size: 23px;
    font-weight: 850;
    letter-spacing: 2px;
  }

  .hero .progress {
    margin-top: 16px;
  }

  .balance,
  .hero .balance {
    margin-top: 22px;
    padding: 16px;
  }

  .balance-number {
    color: var(--accent);
    font-size: 38px;
    line-height: 1.1;
    font-weight: 850;
  }

  .label {
    margin-top: 7px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
  }

  .hero-link {
    margin-top: 18px;
    background: var(--accent);
    border-color: var(--accent);
    color: #111108;
    font-weight: 800;
  }

  .hero-link:active:not(:disabled) {
    background: #ebc817;
  }

  .backup-link {
    margin-top: 22px;
  }

  .summary-link {
    margin-top: 10px;
  }

  .spaced {
    margin-top: 12px;
  }

  /* Нижняя навигация */

  nav {
    background: #10100f;
    border-top-color: #ffda292b;
  }

  .nav-button {
    min-height: 50px;
    border-radius: 8px;
    color: #8f8f81;
    font-size: 10px;
  }

  .nav-icon {
    font-size: 20px;
  }

  .nav-button.active {
    background: #ffda2910;
    color: var(--accent);
    box-shadow: inset 0 2px 0 var(--accent);
  }

  /* Формы и итоги */

  dialog {
    padding: 20px;
    border-color: #ffda2938;
    border-radius: 12px;
    background: #141413;
  }

  input,
  select,
  textarea {
    border-radius: 8px;
    border-color: var(--border);
    background: #0c0c0b;
  }

  .summary-row {
    gap: 12px;
    padding: 11px 0;
    font-size: 13px;
  }

  .summary-total {
    color: var(--accent);
  }

  .empty {
    margin-top: 16px;
    padding: 18px;
    border-radius: 10px;
    font-size: 13px;
  }
</style>
<style>
  /* Полные названия без ограничения строк */
  .task-title {
    display: block;
    overflow: visible;
    white-space: normal;
    overflow-wrap: anywhere;
    max-height: none;
    -webkit-line-clamp: unset;
  }

  /* Тип задания и награды — компактной строкой.
     На узком экране перенос разрешён. */
  .compact-details {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 5px 8px;
    margin: 7px 0 12px;
    font-size: 12px;
    line-height: 1.4;
  }

  .detail-muted,
  .detail-separator {
    color: var(--muted);
  }

  .detail-reward {
    color: var(--accent);
    font-weight: 650;
  }

  .done .detail-reward {
    color: #b9a84e;
  }

  .more-button {
    font-size: 24px;
    line-height: 1;
    color: var(--muted);
  }

  .menu-actions {
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }

  /* Только клавиатурный фокус получает обводку */
  button:focus:not(:focus-visible) {
    outline: none;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }
</style>
<style>
  .compact-details .detail-reward {
    display: inline-block;
    max-width: 100%;
  }

  .compact-details .detail-separator {
    display: none;
  }

  .compact-details {
    column-gap: 14px;
    row-gap: 4px;
  }
</style>
<style>
  .quest-reward-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 6px 0 8px;
  }

  .quest-reward-line .compact-details {
    flex: 1;
    min-width: 0;
    margin: 0;
  }

  .quest-plan-toggle {
    flex: 0 0 auto;
    min-height: 32px !important;
    margin: 0 !important;
    gap: 6px !important;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }

  .quest-plan-toggle input {
    flex: 0 0 18px !important;
    width: 18px !important;
    height: 18px !important;
    min-height: 18px !important;
  }

  @media (max-width: 390px) {
    .quest-reward-line {
      align-items: flex-start;
      flex-direction: column;
      gap: 3px;
    }

    .quest-plan-toggle {
      align-self: flex-start;
    }
  }
</style>
<style>
  /* Центральное уведомление о награде */
  .reward-toast {
    position: fixed;
    z-index: 100;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(.85);

    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 210px;
    max-width: calc(100vw - 40px);
    min-height: 82px;
    padding: 18px 26px;

    border: 2px solid var(--accent);
    border-radius: 14px;
    background: #18180f;
    color: var(--accent);
    text-align: center;
    font-size: 25px;
    font-weight: 900;
    white-space: nowrap;

    opacity: 0;
    pointer-events: none;

    box-shadow:
      0 0 0 9999px #00000066,
      0 0 35px #ffda2966,
      0 12px 35px #000c;
  }

  .reward-toast.show {
    animation: reward-toast-center 1.7s ease-out forwards;
  }

  .reward-toast.level-up {
    animation-duration: 3.6s;
    min-width: 260px;
    min-height: 96px;
    border-color: #fff29a;
    background: #302b0d;
    color: #fff29a;
    font-size: 27px;
    box-shadow:
      0 0 0 9999px #00000070,
      0 0 45px #ffda2999,
      0 14px 40px #000d;
  }

  @keyframes reward-toast-center {
    0% {
      opacity: 0;

    15% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08);
    }

    30% {
      transform: translate(-50%, -50%) scale(1);
    }

    75% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.96);
    }
  }

  @media (max-width: 390px) {
    .reward-toast {
      min-width: 190px;
      min-height: 74px;
      padding: 16px 20px;
      font-size: 21px;
    }

    .reward-toast.level-up {

  @media (prefers-reduced-motion: reduce) {

      animation: reward-toast-simple-center 1.3s ease-out forwards;

  @keyframes reward-toast-simple-center {

      transform: translate(-50%, -50%) scale(1);

    100% {

</style>

<body>
<div class="app">
  <header class="topbar">
    <span class="brand">LIFE / GAME</span>
    <span id="wallet" aria-live="polite">0 монет</span>
  </header>

  <p id="save-warning" role="alert" hidden></p>
  <main id="screen"></main>
</div>

<nav aria-label="Главное меню">
  <button type="button" class="nav-button" data-page="hero">
    <span class="nav-icon" aria-hidden="true">◉</span>Герой
  </button>
  <button type="button" class="nav-button" data-page="blocks">
    <span class="nav-icon" aria-hidden="true">▦</span>Блоки
  </button>
  <button type="button" class="nav-button" data-page="quests">
    <span class="nav-icon" aria-hidden="true">◇</span>Квесты
  </button>
  <button type="button" class="nav-button" data-page="bonuses">
    <span class="nav-icon" aria-hidden="true">✧</span>Бонусы
  </button>
</nav>

<dialog id="editor" aria-labelledby="editor-title"></dialog>

<dialog id="backup-dialog" aria-labelledby="backup-title">
  <h2 id="backup-title">Резервная копия</h2>

  <p>
    Создай копию и сохрани весь текст вне приложения.
    Для восстановления вставь ранее сохранённую копию.
  </p>

  <button type="button" class="button full" id="generate-backup">
    Создать копию
  </button>

  <label for="backup-text">Данные сохранения</label>
  <textarea id="backup-text"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"></textarea>

  <div class="form-actions">
    <button type="button" class="button" id="copy-backup">
      Копировать
    </button>
    <button type="button" class="button secondary" id="restore-backup">
      Восстановить
    </button>
    <button type="button" class="button secondary" id="close-backup">
      Закрыть
    </button>
  </div>

  <p id="backup-status" role="status"></p>
</dialog>

<script>
"use strict";

(() => {
  // ===== Настройки и состояние =====

  const STORAGE_KEY = "lifegame-prototype-v1";
    const MIN_DAY_TASKS = 3;
  const DAY_REWARD = 100;
  const LEVEL_COST = 1000;

  const BLOCKS = [
    "Душевное состояние",
    "Физическое состояние",
    "Знания, навыки, опыт",
    "Ресурсы и материальное",
    "Окружение и отношения",
    "Наполнение и организация",
    "Обстоятельства",
    "Исключить"
  ];

  const screen = document.getElementById("screen");
  const wallet = document.getElementById("wallet");
  const warning = document.getElementById("save-warning");
  const editor = document.getElementById("editor");
  const backupDialog = document.getElementById("backup-dialog");
  const backupText = document.getElementById("backup-text");
  const backupStatus = document.getElementById("backup-status");

  let state = emptyState();
  let storedSnapshot = null;
  let storageHealthy = true;
  let page = "hero";
  let block = null;
  let view;

  function emptyState() {
    return {
      tasks: [],
      quests: [],
      bonuses: [],
      completions: [],
      purchases: [],
      dayPlans: {},
      dayPlanDate: null
    };
  }

  function clone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function uid() {
    if (typeof crypto.randomUUID === "function") {
      return crypto.randomUUID();
    }

    const bytes = crypto.getRandomValues(new Uint8Array(16));

    return Array.from(
      bytes,
      value => value.toString(16).padStart(2, "0")
    ).join("");
  }

  function dateKey(date = new Date()) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function today() {
    return dateKey();
  }

  function dateLabel() {
    return new Date().toLocaleDateString("ru-RU", {
      day: "numeric",
      month: "long"
    });
  }

  function fail(message) {
    throw new Error(message);
  }

  function integer(value, min, max) {
    return Number.isSafeInteger(value) &&
      value >= min && value <= max;
  }

  function validDate(value) {
    if (
      typeof value !== "string" ||
      !/^\d{4}-\d{2}-\d{2}$/.test(value)
    ) return false;

    const date = new Date(value + "T12:00:00Z");

    return Number.isFinite(date.getTime()) &&
      date.toISOString().slice(0, 10) === value;
  }

  function validName(value) {
    return typeof value === "string" &&
      value.trim().length > 0 &&
      value.length <= 120;
  }

  function validId(value) {
    return typeof value === "string" &&
      value.length > 0;
  }

  // ===== Проверка и совместимость сохранений =====

  function normalize(raw) {
    if (
      !raw || typeof raw !== "object" ||
      Array.isArray(raw) ||
      !Array.isArray(raw.tasks) ||
      !Array.isArray(raw.completions)
    ) {
      fail("Неверная структура сохранения.");
    }

    const data = clone(raw);

    for (const key of ["quests", "bonuses", "purchases"]) {
      if (data[key] === undefined) data[key] = [];
    }

    for (const key of [
      "tasks", "quests", "bonuses", "completions", "purchases"
    ]) {
      if (!Array.isArray(data[key])) {
        fail("Некорректный список: " + key);
      }

      const ids = new Set();

      for (const item of data[key]) {
        if (
          !item || typeof item !== "object" ||
          !validId(item.id) || ids.has(item.id)
        ) {
          fail("Повреждены записи списка: " + key);
        }

        ids.add(item.id);
      }
    }

    function optionalBoolean(item, key) {
      if (item[key] === undefined) item[key] = false;

      if (typeof item[key] !== "boolean") {
        fail("Некорректное поле: " + key);
      }
    }

    for (const task of data.tasks) {
      if (
        !validName(task.name) ||
        !integer(task.block, 0, 7) ||
        !["once", "daily"].includes(task.type) ||
        !integer(task.reward, 1, 100000)
      ) fail("Повреждены данные задания.");

      optionalBoolean(task, "favorite");
    }

    const completionKeys = new Set();

    for (const record of data.completions) {
      if (
        !validId(record.taskId) ||
        !validDate(record.date) ||
        !integer(record.reward, 1, 100000)
      ) fail("Повреждена история начислений.");

      const key = JSON.stringify([record.taskId, record.date]);

      if (completionKeys.has(key)) {
        fail("Повторное начисление в истории.");
      }

      completionKeys.add(key);

      if (record.sourceCompletionIds !== undefined) {
        if (
          !Array.isArray(record.sourceCompletionIds) ||
          !record.sourceCompletionIds.every(validId) ||
          new Set(record.sourceCompletionIds).size !==
            record.sourceCompletionIds.length
        ) fail("Повреждены связи бонуса дня.");
      }
    }

    const recordsById = new Map(
      data.completions.map(record => [record.id, record])
    );

    for (const quest of data.quests) {
      if (
        !validName(quest.name) ||
        !integer(quest.target, 1, 1000000) ||
        !integer(quest.progress, 0, quest.target) ||
        !integer(quest.step, 1, 1000000) ||
        !integer(quest.reward, 1, 100000)
      ) fail("Повреждены данные квеста.");

      optionalBoolean(quest, "favorite");
      optionalBoolean(quest, "showInDay");

      if (quest.stepReward === undefined) quest.stepReward = 0;
      if (quest.stepHistory === undefined) quest.stepHistory = [];

      if (
        !integer(quest.stepReward, 0, 100000) ||
        !Array.isArray(quest.stepHistory)
      ) fail("Повреждена награда или история шагов квеста.");

      let previousTo = null;
      const payments = new Set();

      for (const entry of quest.stepHistory) {
        if (
          !entry || typeof entry !== "object" ||
          !integer(entry.from, 0, quest.target) ||
          !integer(entry.to, 1, quest.target) ||
          entry.to <= entry.from ||
          (previousTo !== null && entry.from !== previousTo)
        ) fail("Нарушена последовательность шагов квеста.");

        previousTo = entry.to;

        if (entry.completionId === undefined) {
          entry.completionId = null;
        }

        if (entry.completionId !== null) {
          const payment = recordsById.get(entry.completionId);

          if (
            !payment ||
            payments.has(entry.completionId) ||
            payment.taskId !==
              `quest:step:${quest.id}:${entry.completionId}`
          ) fail("Повреждена связь шага с начислением.");

          payments.add(entry.completionId);
        }
      }

      if (
        quest.stepHistory.length &&
        previousTo !== quest.progress
      ) fail("История шагов не соответствует прогрессу квеста.");
    }

    for (const bonus of data.bonuses) {
      if (bonus.description === undefined) bonus.description = "";

      if (
        !validName(bonus.name) ||
        typeof bonus.description !== "string" ||
        bonus.description.length > 300 ||
        !integer(bonus.price, 1, 1000000)
      ) fail("Повреждены данные бонуса.");

      optionalBoolean(bonus, "favorite");
    }

    for (const purchase of data.purchases) {
      if (
        !validName(purchase.name) ||
        !validId(purchase.bonusId) ||
        !integer(purchase.price, 1, 1000000) ||
        typeof purchase.createdAt !== "string" ||
        !Number.isFinite(Date.parse(purchase.createdAt))
      ) fail("Повреждена история покупок.");
    }

    if (data.dayPlans === undefined) data.dayPlans = {};

    if (
      !data.dayPlans ||
      typeof data.dayPlans !== "object" ||
      Array.isArray(data.dayPlans)
    ) fail("Повреждены планы дня.");

    for (const [date, ids] of Object.entries(data.dayPlans)) {
      if (
        !validDate(date) ||
        !Array.isArray(ids) ||
        !ids.every(validId) ||
        new Set(ids).size !== ids.length
      ) fail("Повреждён список заданий в плане дня.");
    }

    if (data.dayPlanDate === undefined) data.dayPlanDate = null;

    if (
      data.dayPlanDate !== null &&
      !validDate(data.dayPlanDate)
    ) fail("Некорректная дата плана.");

    const money = totals(data);

    if (
      !Number.isSafeInteger(money.earned) ||
      !Number.isSafeInteger(money.spent) ||
      money.balance < 0
    ) fail("Некорректный баланс монет.");

    return data;
  }

  function totals(data) {
    const earned = data.completions.reduce(
      (sum, record) => sum + record.reward, 0
    );

    const spent = data.purchases.reduce(
      (sum, purchase) => sum + purchase.price, 0
    );

    return { earned, spent, balance: earned - spent };
  }

  function storageError(message) {
    storageHealthy = false;
    warning.hidden = false;
    warning.textContent = message;
  }

  try {
    storedSnapshot = localStorage.getItem(STORAGE_KEY);

    if (storedSnapshot !== null) {
      state = normalize(JSON.parse(storedSnapshot));
    }
  } catch (error) {
    storageError(
      "Не удалось прочитать сохранение. " +
      "Изменения отключены, чтобы не перезаписать данные. " +
      "Не очищай хранилище. Ошибка: " + error.message
    );
  }

  // ===== План дня и начисления =====

  function ensureDay(data) {
    const date = today();

    if (!Array.isArray(data.dayPlans[date])) {
      const dates = Object.keys(data.dayPlans)
        .filter(value => value < date)
        .sort();

      const previousDate = dates[dates.length - 1];
      const previousIds = new Set(
        previousDate ? data.dayPlans[previousDate] : []
      );

      data.dayPlans[date] = data.tasks
        .filter(task =>
          task.type === "daily" &&
          previousIds.has(task.id)
        )
        .map(task => task.id);
    }

    data.dayPlanDate = date;
  }

  function plannedTasks(data) {
    const ids = new Set(data.dayPlans[today()] || []);
    return data.tasks.filter(task => ids.has(task.id));
  }

  function completion(data, task, onlyToday = false) {
    const date = today();

    return data.completions.find(record =>
      record.taskId === task.id &&
      (
        (!onlyToday && task.type === "once") ||
        record.date === date
      )
    );
  }

  function addRecord(data, taskId, reward, extra = {}) {
    const record = {
      id: uid(),
      taskId,
      date: today(),
      reward,
      ...extra
    };

    data.completions.push(record);
    return record;
  }

  function reconcileDayBonus(data) {
    const existing = new Set(
      data.completions.map(record => record.id)
    );

    data.completions = data.completions.filter(record =>
      !record.taskId.startsWith("day-bonus:") ||
      !Array.isArray(record.sourceCompletionIds) ||
      record.sourceCompletionIds.every(id => existing.has(id))
    );

    const bonusId = `day-bonus:${today()}`;

    if (data.completions.some(record => record.taskId === bonusId)) {
      return;
    }

    const tasks = plannedTasks(data);

    if (tasks.length < MIN_DAY_TASKS) return;

    const records = tasks.map(task => completion(data, task, true));

    if (records.some(record => !record)) return;

    addRecord(data, bonusId, DAY_REWARD, {
      sourceCompletionIds: records.map(record => record.id)
    });
  }

  // ===== Единая транзакция =====

  function refreshFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);

      if (raw === storedSnapshot) return true;

      state = raw === null
        ? emptyState()
        : normalize(JSON.parse(raw));

      storedSnapshot = raw;
      return true;
    } catch (error) {
      storageError(
        "Не удалось обновить данные из хранилища: " +
        error.message
      );
      return false;
    }
  }

  function transact(change, awardDayBonus = true) {
    if (!storageHealthy) {
      alert("Изменения отключены из-за ошибки хранилища.");
      return false;
    }

    let currentRaw;

    try {
      currentRaw = localStorage.getItem(STORAGE_KEY);
    } catch (error) {
      storageError("Хранилище недоступно: " + error.message);
      render();
      return false;
    }

    if (currentRaw !== storedSnapshot) {
      refreshFromStorage();
      render();

      alert(
        "Данные изменились в другой вкладке. " +
        "Экран обновлён. Повтори действие."
      );

      return false;
    }

        const earnedBefore = totals(state).earned;
    const levelBefore = Math.floor(
  earnedBefore / LEVEL_COST
) + 1;
    const completionIdsBefore = new Set(
      state.completions.map(record => record.id)
    );

    let next;

    try {
      const draft = clone(state);

      ensureDay(draft);
      change(draft);

      if (awardDayBonus) reconcileDayBonus(draft);

      if (totals(draft).balance < 0) {
        fail(
          "Эти монеты уже потрачены. Сначала отмени " +
          "покупку в истории бонусов, затем повтори действие."
        );
      }

      next = normalize(draft);
    } catch (error) {
      alert(error.message);
      render();
      return false;
    }

    try {
      const serialized = JSON.stringify(next);
      localStorage.setItem(STORAGE_KEY, serialized);
            storedSnapshot = serialized;
      state = next;

            const earnedAfter = totals(state).earned;
      const rewardAmount = earnedAfter - earnedBefore;
      const levelAfter = Math.floor(
        earnedAfter / LEVEL_COST
      ) + 1;

      const dayBonusAdded = state.completions.some(record =>
        !completionIdsBefore.has(record.id) &&
        record.taskId.startsWith("day-bonus:")
      );

      render();

      if (rewardAmount > 0) {
        playCoinSound();
        showRewardToast(rewardAmount);
      }

      if (dayBonusAdded) {
        setTimeout(() => {
          playDayBonusSound();
          showDayBonusToast();
        }, rewardAmount > DAY_REWARD ? 900 : 150);
      }

            if (levelAfter > levelBefore) {
        setTimeout(() => {
          playLevelUpSound();
          showRewardToast(0, levelAfter);
        }, rewardAmount > 0 ? 1900 : 250);
      }

      return true;
    } catch (error) {
      storageError(
        "Сохранение не удалось. Действие не применено. " +
        "Изменения отключены до перезагрузки. Ошибка: " +
        error.message
      );

      render();
      return false;
    }

    
  }

  function syncDay() {
    if (!storageHealthy) return;

    if (
      state.dayPlanDate !== today() ||
      !Array.isArray(state.dayPlans[today()])
    ) {
      transact(() => {}, false);
    }
  }

  // ===== DOM и общие элементы =====

  function el(tag, className = "", text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function btn(text, className, action, mutating = false) {
    const node = el("button", className, text);
    node.type = "button";
    node.disabled = mutating && !storageHealthy;
    node.addEventListener("click", action);
    return node;
  }

  function go(nextPage, nextBlock = null) {
    syncDay();
    page = nextPage;
    block = nextBlock;
    render();
    window.scrollTo(0, 0);
  }

  function progressBar(value, max, label) {
    const bar = el("div", "progress");

    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-label", label);
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(max));
    bar.setAttribute("aria-valuenow", String(value));

    const fill = el("div", "progress-fill");
    fill.style.width = `${max ? value / max * 100 : 0}%`;

    bar.append(fill);
    return bar;
  }
  let coinAudioContext = null;
  function playLevelUpSound() {
    try {
      const AudioContext =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContext) return;

      if (!coinAudioContext) {
        coinAudioContext = new AudioContext();
      }

      if (coinAudioContext.state === "suspended") {
        coinAudioContext.resume();
      }

      const now = coinAudioContext.currentTime;

      const notes = [
        { frequency: 523.25, delay: 0 },
        { frequency: 659.25, delay: 0.14 },
        { frequency: 783.99, delay: 0.28 },
        { frequency: 1046.5, delay: 0.44 }
      ];

      notes.forEach(note => {
        const oscillator = coinAudioContext.createOscillator();
        const gain = coinAudioContext.createGain();

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(
          note.frequency,
          now + note.delay
        );

        gain.gain.setValueAtTime(
          0.0001,
          now + note.delay
        );

        gain.gain.exponentialRampToValueAtTime(
          0.16,
          now + note.delay + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + note.delay + 0.42
        );

        oscillator.connect(gain);
        gain.connect(coinAudioContext.destination);

        oscillator.start(now + note.delay);
        oscillator.stop(now + note.delay + 0.45);
      });
    } catch (error) {
      console.warn(
        "Звук повышения уровня недоступен:",
        error
      );
    }
  }
    function playToneSequence(notes, volume = 0.14) {
    try {
      const AudioContext =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContext) return;

      if (!coinAudioContext) {
        coinAudioContext = new AudioContext();
      }

      if (coinAudioContext.state === "suspended") {
        coinAudioContext.resume();
      }

      const now = coinAudioContext.currentTime;

      notes.forEach(note => {
        const oscillator = coinAudioContext.createOscillator();
        const gain = coinAudioContext.createGain();

        oscillator.type = note.type || "triangle";

        oscillator.frequency.setValueAtTime(
          note.frequency,
          now + note.delay
        );

        gain.gain.setValueAtTime(
          0.0001,
          now + note.delay
        );

        gain.gain.exponentialRampToValueAtTime(
          volume,
          now + note.delay + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + note.delay + note.duration
        );

        oscillator.connect(gain);
        gain.connect(coinAudioContext.destination);

        oscillator.start(now + note.delay);
        oscillator.stop(
          now + note.delay + note.duration + 0.03
        );
      });
    } catch (error) {
      console.warn("Звук недоступен:", error);
    }
  }

  function playDayBonusSound() {
    playToneSequence([
      { frequency: 523.25, delay: 0, duration: .28 },
      { frequency: 659.25, delay: .13, duration: .28 },
      { frequency: 783.99, delay: .26, duration: .32 },
      { frequency: 1046.5, delay: .43, duration: .55 }
    ], 0.17);
  }

  function playPurchaseSound() {
    playToneSequence([
      { frequency: 392, delay: 0, duration: .18 },
      { frequency: 523.25, delay: .12, duration: .24 },
      { frequency: 659.25, delay: .25, duration: .38 }
    ], 0.12);
  }
  function playCoinSound() {
    try {
      const AudioContext =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContext) return;

      if (!coinAudioContext) {
        coinAudioContext = new AudioContext();
      }

      if (coinAudioContext.state === "suspended") {
        coinAudioContext.resume();
      }

      const now = coinAudioContext.currentTime;

      // Небольшая последовательность нот,
      // создающая ощущение падающих монет.
      const notes = [
        { frequency: 880, delay: 0 },
        { frequency: 1175, delay: 0.07 },
        { frequency: 1480, delay: 0.14 }
      ];

      notes.forEach(note => {
        const oscillator = coinAudioContext.createOscillator();
        const gain = coinAudioContext.createGain();

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(
          note.frequency,
          now + note.delay
        );

        gain.gain.setValueAtTime(
          0.0001,
          now + note.delay
        );

        gain.gain.exponentialRampToValueAtTime(
          0.12,
          now + note.delay + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + note.delay + 0.16
        );

        oscillator.connect(gain);
        gain.connect(coinAudioContext.destination);

        oscillator.start(now + note.delay);
        oscillator.stop(now + note.delay + 0.18);
      });
    } catch (error) {
      // Звук необязателен: ошибка аудио не должна
      // ломать начисление монет.
      console.warn("Звук монет недоступен:", error);
    }
  }

    if (!storageHealthy) return;

    editor.replaceChildren();

    const form = el("form");

    form.firstElementChild.id = "editor-title";

    const inputs = {};

    fields.forEach(field => {
      const id = "edit-" + field.key;
      const label = el("label", "", field.label);
      label.htmlFor = id;

      const input = el(field.options ? "select" : "input");
      input.id = id;

      if (field.options) {
        field.options.forEach(([value, text]) => {
          const option = el("option", "", text);
          option.value = value;
          input.append(option);
        });
      } else {
        input.type = field.type || "text";

        for (const key of ["min", "max", "step", "maxLength"]) {
          if (field[key] !== undefined) input[key] = field[key];
        }
      }

      input.required = field.required !== false;
      input.value = String(field.value ?? "");
      inputs[field.key] = input;
      form.append(label, input);

      if (field.hint) {
        form.append(el("p", "meta", field.hint));
      }
    });

    const actions = el("div", "form-actions");
    const create = el("button", "button", "Создать");
    create.type = "submit";

    actions.append(
      btn("Отмена", "button secondary", () => editor.close()),
      create
    );

    form.append(actions);

    form.addEventListener("submit", event => {
      event.preventDefault();

      const values = {};

      fields.forEach(field => {
        values[field.key] = field.type === "number"
          ? Number(inputs[field.key].value)
          : inputs[field.key].value.trim();
      });

      if (submit(values)) editor.close();
    });

    editor.append(form);
    editor.showModal();
    Object.values(inputs)[0]?.focus();
  }

  function toggleTask(id) {
    const task = state.tasks.find(item => item.id === id);
    if (!task) return;

    const record = completion(state, task);

    if (record && !confirm(
      "Отменить выполнение? Награда и связанный " +

    transact(data => {

        addRecord(data, actual.id, actual.reward);

  function moveQuest(id, direction) {
    const quest = state.quests.find(item => item.id === id);
    if (!quest) return;

    if (
      direction < 0 &&
      !confirm(
        "Отменить последний шаг? Монеты за него, " +
        "а при необходимости и награда за завершение, " +
        "будут убраны."
      )
    ) return;

    transact(data => {
      const actual = data.quests.find(item => item.id === id);
      if (!actual) return;

      const history = actual.stepHistory;
      const last = history[history.length - 1];

      const next = direction > 0
        ? Math.min(actual.target, actual.progress + actual.step)
        : last && last.to === actual.progress
          ? last.from
          : Math.max(0, actual.progress - actual.step);

      if (next === actual.progress) return;

      if (direction > 0) {
        let paymentId = null;

        if (actual.stepReward > 0) {
          paymentId = uid();

          addRecord(
            data,
            `quest:step:${id}:${paymentId}`,
            actual.stepReward,
            { id: paymentId }
          );
        }

        history.push({
          from: actual.progress,
          to: next,
          completionId: paymentId
        });
      } else if (last && last.to === actual.progress) {
        history.pop();

        if (last.completionId) {
          data.completions = data.completions.filter(
            record => record.id !== last.completionId
          );
        }
      }

      actual.progress = next;

      const finalReward = data.completions.find(
        record => record.taskId === `quest:${id}`
      );

      if (next === actual.target && !finalReward) {
        addRecord(data, `quest:${id}`, actual.reward);
      }

      if (next < actual.target && finalReward) {
        data.completions = data.completions.filter(
          record => record.id !== finalReward.id
        );
      }
    });
  }

      return;
    }

    transact(data => {
      const actual = data.quests.find(item => item.id === id);
      if (actual) actual.stepReward = value;
    });
  }

  function buildView() {
    const date = today();
    const anyTask = new Map();
    const todayTask = new Map();
    const recordsToday = [];

    for (const record of state.completions) {
      if (!anyTask.has(record.taskId)) {
        anyTask.set(record.taskId, record);
      }

      if (record.date === date) {
        todayTask.set(record.taskId, record);
        recordsToday.push(record);
      }
    }

    const planIds = new Set(state.dayPlans[date] || []);
    const planned = state.tasks.filter(task => planIds.has(task.id));

    return {
      anyTask,
      todayTask,
      recordsToday,
      planIds,
      planned,
      plannedDone: planned.filter(task => todayTask.has(task.id)),
      bonus: todayTask.get(`day-bonus:${date}`),
      money: totals(state)
    };
  }

      ? view.anyTask.has(task.id)
      : view.todayTask.has(task.id);

    section("", favoriteSort(tasks.filter(task => !done(task))), taskCard);
    section(
      "ВЫПОЛНЕННЫЕ",
      favoriteSort(tasks.filter(done)),
      taskCard
    );

    if (!tasks.length) {
      screen.append(el("div", "empty", "Пока заданий нет. Добавь первое."));
    }
  }

  function renderQuests() {
    screen.append(
      el("h1", "", "КВЕСТЫ"),
      el("p", "", "Большие цели — маленькими шагами."),
      btn("+ Добавить квест", "button full", createQuest, true)
    );

    section(
      "",
      favoriteSort(state.quests.filter(q => q.progress < q.target)),
      quest => questCard(quest)
    );

    section(
      "ЗАВЕРШЁННЫЕ",
      favoriteSort(state.quests.filter(q => q.progress >= q.target)),
      quest => questCard(quest)
    );

    if (!state.quests.length) {
      screen.append(el("div", "empty", "Пока квестов нет. Создай первую цель."));
    }
  }

  function renderBonuses() {
    screen.append(
      el("h1", "", "БОНУСЫ"),
      balanceCard(view.money.balance),
      btn(
        "+ Добавить бонус",
        "button full spaced",
        createBonus,
        true
      )
    );

        const purchasedBonusIds = new Set(
      state.purchases.map(purchase => purchase.bonusId)
    );

    const availableBonuses = state.bonuses.filter(
      bonus => !purchasedBonusIds.has(bonus.id)
    );

    section(
      "",
      favoriteSort(availableBonuses),
      bonusCard
    );

    if (!availableBonuses.length) {
      screen.append(
        el(
          "div",
          "empty",
          state.bonuses.length
            ? "Добавь награду и назначь ей цену."
            : "Добавь награду и назначь ей цену."
        )
      );
    }

    section(
      "ИСТОРИЯ ПОКУПОК",
      [...state.purchases].reverse(),
      purchaseCard
    );
  }

  function renderDay() {
    screen.append(
      btn("← Герой", "back", () => go("hero")),
      el("h1", "", "КОНСТРУКТОР ДНЯ"),
      el("p", "", dateLabel())
    );

    const summary = el("div", "card");
    const total = view.planned.length;
    const done = view.plannedDone.length;
    const percent = total ? Math.round(done / total * 100) : 0;

    const hint = el(
      "p",
      "",
      view.bonus
        ? "✓ Бонус дня получен: +100 монет"
        : total < MIN_DAY_TASKS
          ? "Для бонуса нужно минимум 3 задания"
          : "Выполни весь план: +50 монет"
    );

    hint.style.marginBottom = "0";
    if (view.bonus) hint.style.color = "var(--accent)";

    summary.append(
      el("div", "task-title", `Выполнено ${done} из ${total}`),
      progressBar(percent, 100, "Выполнение плана дня"),
      hint
    );

    screen.append(summary);

    if (!total) {
      screen.append(
        el("div", "empty",
          "План пока пуст. Отметь нужные задания в блоках.")
      );
    }

    section(
      "ЗАДАНИЯ",
      favoriteSort(view.planned.filter(
        task => !view.todayTask.has(task.id)
      )),
      taskCard
    );

        const visibleQuests = state.quests.filter(
      quest => quest.showInDay
    );

    section(
      "КВЕСТЫ",
      favoriteSort(
        visibleQuests.filter(
          quest => quest.progress < quest.target
        )
      ),
      quest => questCard(quest, true)
    );

    const completedItems = favoriteSort([
      ...view.plannedDone.map(task => ({
        ...task,
        itemKind: "task"
      })),

      ...visibleQuests
        .filter(quest => quest.progress >= quest.target)
        .map(quest => ({
          ...quest,
          itemKind: "quest"
        }))
    ]);

    section(
      "ВЫПОЛНЕНО",
      completedItems,
      item => item.itemKind === "quest"
        ? questCard(item, true)
        : taskCard(item)
    );
  }

  function summaryRow(container, title, value, total = false) {
    const row = el("div", "summary-row");

    row.append(
      el("span", "", title),
      el("strong", total ? "summary-total" : "", String(value))
    );

    container.append(row);
  }

  function renderSummary() {
    screen.append(
      btn("← Герой", "back", () => go("hero")),
      el("h1", "", "ИТОГИ ДНЯ"),
      el("p", "", dateLabel())
    );

    const records = view.recordsToday;

    const tasks = records.filter(record =>
      !record.taskId.startsWith("quest:") &&
      !record.taskId.startsWith("day-bonus:")
    );

    const steps = records.filter(
      record => record.taskId.startsWith("quest:step:")
    );

    const quests = records.filter(record =>
      record.taskId.startsWith("quest:") &&
      !record.taskId.startsWith("quest:step:")
    );

    const bonuses = records.filter(
      record => record.taskId.startsWith("day-bonus:")
    );

    const sum = list => list.reduce(
      (result, item) => result + item.reward, 0
    );

    const spent = state.purchases
      .filter(purchase =>
        dateKey(new Date(purchase.createdAt)) === today()
      )
      .reduce((result, item) => result + item.price, 0);

    const activity = el("section", "card");
    const money = el("section", "card spaced");

    summaryRow(activity, "Выполнено заданий", tasks.length);
    summaryRow(
      activity,
      "План дня",
      `${view.plannedDone.length} из ${view.planned.length}`
    );
    summaryRow(activity, "Завершено квестов", quests.length);

    summaryRow(money, "За задания", `+${sum(tasks)}`);
    summaryRow(money, "За завершение квестов", `+${sum(quests)}`);
    summaryRow(money, "За шаги квестов", `+${sum(steps)}`);
    summaryRow(money, "Бонус дня", `+${sum(bonuses)}`);
    summaryRow(money, "Всего заработано", `${sum(records)} монет`, true);
    summaryRow(money, "Потрачено", `${spent} монет`);

    screen.append(activity, money);
  }

  function render() {
    view = buildView();
    screen.replaceChildren();
    wallet.textContent = `${view.money.balance} монет`;

    const activePage = ["day", "summary"].includes(page) ? "hero" : page;

    document.querySelectorAll(".nav-button").forEach(node => {
      const active = node.dataset.page === activePage;
      node.classList.toggle("active", active);

      if (active) node.setAttribute("aria-current", "page");
      else node.removeAttribute("aria-current");
    });

    const screens = {
      hero: renderHero,
      blocks: renderBlocks,
      quests: renderQuests,
      bonuses: renderBonuses,
      day: renderDay,
      summary: renderSummary
    };

    (screens[page] || renderHero)();
  }

  // ===== Резервные копии =====

  document.getElementById("generate-backup")
    .addEventListener("click", () => {
      if (!storageHealthy) {
        backupStatus.textContent =
          "Сохранение содержит ошибку. " +
          "Не заменяй прежнюю резервную копию.";
        return;
      }

      if (!refreshFromStorage()) return;

      backupText.value = JSON.stringify({
        app: "LifeGame",
        version: 1,
        createdAt: new Date().toISOString(),
        data: state
      }, null, 2);

      render();
      backupStatus.textContent =
        "Копия подготовлена. Скопируй её и сохрани вне приложения.";
    });

  document.getElementById("copy-backup")
    .addEventListener("click", async () => {
      if (!backupText.value.trim()) {
        backupStatus.textContent = "Сначала создай копию.";
        return;
      }

      try {
        await navigator.clipboard.writeText(backupText.value);
        backupStatus.textContent =
          "Скопировано. Вставь текст в надёжное место.";
      } catch {
        backupText.focus();
        backupText.select();
        backupStatus.textContent =
          "Скопируй выделенный текст вручную.";
      }
    });

  document.getElementById("restore-backup")
    .addEventListener("click", () => {
      try {
        const parsed = JSON.parse(backupText.value);

        if (
          !parsed ||
          parsed.app !== "LifeGame" ||
          parsed.version !== 1
        ) fail("Это не поддерживаемая копия LifeGame.");

        const restored = normalize(parsed.data);

        if (!confirm(
          "Заменить текущий прогресс этой копией? " +
          "Данные не объединяются. Сохрани текущую копию отдельно."
        )) return;

        ensureDay(restored);
        const checked = normalize(restored);
        const serialized = JSON.stringify(checked);

        // Применяем восстановление только после успешной записи.
        localStorage.setItem(STORAGE_KEY, serialized);

        state = checked;
        storedSnapshot = serialized;
        storageHealthy = true;
        warning.hidden = true;
        warning.textContent = "";
        page = "hero";
        block = null;

        render();

        backupStatus.textContent = "Прогресс восстановлен.";
      } catch (error) {
        backupStatus.textContent =
          "Восстановление не выполнено: " + error.message;
      }
    });

  document.getElementById("close-backup")
    .addEventListener("click", () => backupDialog.close());

  // ===== Навигация и обновление даты =====

  document.querySelectorAll(".nav-button").forEach(node => {
    node.addEventListener("click", () => go(node.dataset.page));
  });

  function refreshVisible() {
    if (document.hidden || !storageHealthy) return;

    refreshFromStorage();
    syncDay();
    render();
  }

  document.addEventListener("visibilitychange", refreshVisible);

  window.addEventListener("storage", event => {
    if (event.key === STORAGE_KEY || event.key === null) {
      refreshVisible();
    }
  });

  setInterval(() => {
    if (
      !document.hidden &&
      storageHealthy &&
      state.dayPlanDate !== today()
    ) {
      refreshVisible();
    }
  }, 30000);

  // Один стартовый проход, без цепочек переопределений.
  syncDay();
  render();
})();
</script>
</body>
</html>
