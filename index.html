    favoriteLabel.append(
      favoriteInput,
      el("span", "", "Только избранные")
    );

    const hint = el(
      "p",
      "meta",
      "Фильтры — только для списка. Автомат выбирает из всех ништяков."
    );

    const count = el("div", "meta");
    count.setAttribute("role", "status");
    count.setAttribute("aria-atomic", "true");

    const results = el("div");
    results.id = "treat-manual-results";

    function drawManualList() {
      const items = state.treats.filter(item =>
        (treatListCategory === "Все" ||
          item.category === treatListCategory) &&
        (!treatListFavoritesOnly || item.favorite)
      );

      items.sort((a, b) =>
        Number(b.favorite) - Number(a.favorite) ||
        a.name.localeCompare(b.name, "ru", {
          sensitivity: "base",
          numeric: true
        }) ||
        a.id.localeCompare(b.id)
      );

      results.replaceChildren();
      count.textContent = "Показано: " + items.length;
      filters.hidden = state.treats.length === 0;

      if (!items.length) {
        results.append(el(
          "div",
          "empty",
          !state.treats.length
            ? "Добавь свой первый ништяк — что-то приятное только для себя."
            : "Здесь пока нет ништяков. Измени фильтры или добавь свой."
        ));
        return;
      }

      const list = el("div", "list");
      for (const item of items) {
        list.append(treatCard(item));
      }
      results.append(list);
    }

    select.addEventListener("change", () => {
      treatListCategory = select.value;
      drawManualList();
    });

    favoriteInput.addEventListener("change", () => {
      treatListFavoritesOnly = favoriteInput.checked;
      drawManualList();
    });

    filters.append(label, select, favoriteLabel, hint);
    manual.append(heading, add, filters, count, results);
    screen.append(manual);
    drawManualList();
  }

  const focusMini = el("div", "focus-mini"); focusMini.hidden = true; document.body.append(focusMini);
  let focusNow = () => Date.now();
  const focusLeft = f => f.status === "running" ? Math.max(0,f.endsAt-focusNow()) : f.remaining;
  function focusTime(ms) { const s=Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
  function focusSave(change) {
    if (!healthy) return false;
    try {
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw!==snapshot) {
        if(loadLatest()) alert("Данные изменились в другой вкладке. Повтори действие.");
        render(); return false;
      }
      const draft=clone(state); change(draft.focus);
      const next=normalize(draft);
      const text=JSON.stringify(next); localStorage.setItem(STORAGE_KEY,text); state=next; snapshot=text;
      return true;
    } catch(error) { storageError("Таймер не сохранён: "+error.message); render(); return false; }
  }
  function redrawFocus() { const old=$("focus-card"); if(old) old.replaceWith(focusCard()); updateFocusMini(); }
  function focusAction(action,id) {
    const f=state.focus;
    if(f.id!==id) return;
    if(action==="start" && f.status!=="ready") return;
    if(action==="pause" && f.status!=="running") return;
    if(action==="resume" && f.status!=="paused") return;
    if(action==="reset" && f.status!=="completed") return;
    if(action==="stop" && !["running","paused"].includes(f.status)) return;
    if(action==="stop" && !confirm("Завершить подход сейчас? Можно вернуться позже.")) return;
    if(action==="pause" && focusLeft(f)===0) { focusTick(); return; }
    if(focusSave(x=>{
      if(action==="start") { x.id=uid(); x.status="running"; x.remaining=x.minutes*60000; x.endsAt=focusNow()+x.remaining; x.notified=false; x.natural=false; }
      if(action==="pause") { x.remaining=focusLeft(x); x.endsAt=null; x.status="paused"; }
      if(action==="resume") { x.endsAt=focusNow()+x.remaining; x.status="running"; }
      if(action==="stop" || action==="reset") { x.status="ready"; x.id=null; x.minutes=5; x.name=""; x.endsAt=null; x.remaining=300000; x.notified=true; x.natural=false; }
    })) {
      if(action==="stop" || action==="reset") focusCustomMode=false;
      redrawFocus();
    }
  }
  let focusCustomMode = false;
  function updateFocusProgress(progress,f) {
    const total=f.minutes*60000, value=Math.max(0,Math.min(100,(total-focusLeft(f))/total*100));
    progress.firstChild.style.width=value+"%";
    progress.setAttribute("aria-valuenow",String(value));
  }
  function focusCard() {
    const f=state.focus, card=el("section","card spaced focus-card"); card.id="focus-card";
    const header=el("div","focus-header");
    header.append(el("h2","","Время для важного"));
    if(f.status!=="ready")header.append(el("span","focus-status",{running:"В процессе",paused:"Пауза",completed:"Завершён"}[f.status]));
    const main=el("div","focus-main"), clock=el("div","focus-clock",focusTime(focusLeft(f)));
    card.append(header);
    if(f.status!=="ready")card.append(el("p","focus-name",f.name));
    main.append(clock); card.append(main);
    if(["running","paused"].includes(f.status)) {
      const progress=el("div","focus-progress");
      progress.setAttribute("role","progressbar");
      progress.setAttribute("aria-label","Прошедшее время подхода");
      progress.setAttribute("aria-valuemin","0"); progress.setAttribute("aria-valuemax","100");
      progress.append(el("div","focus-progress-fill"));
      updateFocusProgress(progress,f); card.append(progress);
    }
    if(f.status==="ready") {
      const options=el("div","focus-options");
      const label=el("label","","Своя длительность"); label.htmlFor="focus-minutes";
      const input=el("input"); input.id="focus-minutes"; input.type="number"; input.min="1"; input.max="180"; input.step="1"; input.inputMode="numeric"; input.value=f.minutes;
      input.addEventListener("focus",()=>input.select());
      const settings=el("div","focus-settings"); settings.hidden=!(focusCustomMode || ![5,15,25].includes(f.minutes));
      const updatePresets=()=>options.querySelectorAll("button").forEach((button,i)=>{
        const custom=focusCustomMode || ![5,15,25].includes(state.focus.minutes);
        button.setAttribute("aria-pressed",String(i===3?custom:!custom&&state.focus.minutes===[5,15,25][i]));
      });
      const saveMinutes=()=>{
        const n=Number(input.value);
        input.setCustomValidity(/^\d+$/.test(input.value)&&Number.isInteger(n)&&n>=1&&n<=180?"":"Введи целое число от 1 до 180");
        if(!input.checkValidity()) { settings.hidden=false; input.reportValidity(); return false; }
        if(!focusSave(x=>{if(x.status==="ready"){x.minutes=n;x.remaining=n*60000;}}))return false;
        clock.textContent=focusTime(n*60000); updatePresets(); return true;
      };
      for(const n of [5,15,25]) options.append(btn(n+" мин","button secondary",()=>{focusCustomMode=false;input.value=n;if(saveMinutes())settings.hidden=true;}));
      options.append(btn("Своё","button secondary",()=>{focusCustomMode=true;input.value=state.focus.minutes;input.setCustomValidity("");updatePresets();settings.hidden=false;resizeName();input.focus();input.select();}));
      updatePresets(); main.append(options);
      input.addEventListener("input",()=>input.setCustomValidity(""));
      const commitMinutes=()=>{focusCustomMode=true;settings.hidden=false;saveMinutes();updatePresets();};
      input.addEventListener("change",commitMinutes);
      input.addEventListener("blur",commitMinutes);
      const nameLabel=el("label","","Название подхода · необязательно"); nameLabel.htmlFor="focus-name";
      const name=el("textarea"); name.id="focus-name"; name.rows=1; name.maxLength=120; name.value=f.name; name.placeholder="Например: чтение, спорт, важный звонок";
      const resizeName=()=>{if(!settings.hidden&&name.isConnected){name.style.height="auto";name.style.height=(name.scrollHeight+2)+"px";}};
      name.addEventListener("input",resizeName);
      requestAnimationFrame(resizeName);
      name.addEventListener("change",()=>{focusSave(x=>{if(x.status==="ready")x.name=name.value.trim();});});
      const minutesRow=el("div","focus-minutes-row"); minutesRow.append(input,el("span","","мин"));
      settings.append(label,minutesRow,nameLabel,name);
      card.append(settings,btn("Начать","button full",()=>{
        if(!card.isConnected || state.focus.status!=="ready")return;
        if(!saveMinutes() || !card.isConnected)return;
        if(!focusSave(x=>{if(x.status==="ready")x.name=name.value.trim();}))return;
        primeAudio();focusAction("start",null);
      }),el("p","focus-hint","Не обязательно закончить всё. Просто начни с этого времени"));
    } else {
      const actions=el("div","focus-actions");
      if(f.status==="completed") {
        card.append(el("h3","focus-result-text",f.natural?"Подход завершён":"Подход завершён. Можно вернуться позже"));
        if(f.natural)card.append(el("p","focus-result-text",`Ты выделил ${f.minutes} минут на важное`));
        actions.classList.add("focus-actions-completed");
        actions.append(btn("Ещё подход","button secondary full",()=>focusAction("reset",f.id)));
      } else {
        card.append(el("p","focus-hint",f.status==="paused"?"На паузе":"Сейчас — только одно дело"));
        actions.append(btn(f.status==="paused"?"Продолжить":"Пауза","button secondary",()=>focusAction(f.status==="paused"?"resume":"pause",f.id)),btn("Завершить","button secondary",()=>focusAction("stop",f.id)));
      }
      card.append(actions);
    }
    return card;
  }
  function updateFocusMini() {
    const card=$("focus-card"), top=document.querySelector('.topbar').getBoundingClientRect().bottom;
    const active=["running","paused"].includes(state.focus.status);
    const show=page==="day"&&card&&active&&card.getBoundingClientRect().bottom<=top;
    focusMini.hidden=!show; focusMini.style.top=top+"px";
    if(!show) {
      document.documentElement.style.scrollPaddingTop=(top+12)+"px";
      focusMini.replaceChildren();
      return;
    }
    const f=state.focus;
    const title=btn(f.name||"Время для важного","focus-mini-title",()=>card.scrollIntoView({block:"center"}));
    const time=el("span","focus-mini-time",focusTime(focusLeft(f)));
    focusMini.replaceChildren(title,time,btn(f.status==="paused"?"▶":"Ⅱ","button secondary",()=>focusAction(f.status==="paused"?"resume":"pause",f.id)));
    focusMini.lastChild.setAttribute("aria-label",f.status==="paused"?"Продолжить":"Пауза");
    document.documentElement.style.scrollPaddingTop=(top+focusMini.getBoundingClientRect().height+12)+"px";
  }
  function focusTick() {
    if(!healthy)return;
    let f=state.focus;
    if(f.status==="running"&&focusLeft(f)===0) {
      if(!focusSave(x=>{x.status="completed";x.remaining=0;x.endsAt=null;x.natural=true;x.name="";}))return;
      redrawFocus(); f=state.focus;
    }
    if(f.status==="completed"&&!f.notified&&!document.hidden) {
      if(focusSave(x=>{x.notified=true;})) {
        try { tones([392,523.25],.22,.45,.045); }
        catch(error) { console.warn("Звук таймера недоступен:",error); }
        if(page!=="day") {
          document.querySelectorAll('.focus-result').forEach(x=>x.remove());
          const toast=el("div","self-toast focus-result");
          toast.style.pointerEvents="auto";
          toast.append(el("strong","","Время завершено ✓"),el("p","",`Ты выделил ${f.minutes} минут на важное`));
          for(const text of ["Ещё подход","Закрыть"])toast.append(btn(text,"button secondary",()=>{
            toast.remove();
            if(text==="Ещё подход") { focusAction("reset",f.id); go("day"); }
          }));
          toast.setAttribute("role","status");document.body.append(toast);
        }
      }
    }
    const clock=$("focus-card")?.querySelector('.focus-clock');
    if(clock && state.focus.status!=="ready")clock.textContent=focusTime(focusLeft(state.focus));
    const progress=$("focus-card")?.querySelector('.focus-progress');
    if(progress)updateFocusProgress(progress,state.focus);
    const miniTime=focusMini.querySelector('.focus-mini-time'); if(miniTime)miniTime.textContent=focusTime(focusLeft(state.focus));
  }
  window.addEventListener("scroll",updateFocusMini,{passive:true});
  window.addEventListener("resize",updateFocusMini);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)focusTick();});
  window.addEventListener("pageshow",focusTick);
  setInterval(focusTick,1000);

  function seedDemoTreatsOnce() {
    const markerKey = "lifegame-demo-treats-v1";

    if (!healthy) return;

    try {
      if (localStorage.getItem(markerKey) === "done") {
        return;
      }
    } catch (error) {
      console.warn(
        "Демонстрационные ништяки не добавлены: " +
        "не удалось прочитать служебную отметку.",
        error
      );
      return;
    }

    const examples = [
      {
        id: "lifegame-demo-treat-v1-01",
        name: "Прогулка без телефона",
        description:
          "Выйди ненадолго на улицу. Посмотри на небо, " +
          "деревья и дома. Никуда не нужно успевать.",
        duration: 15,
        category: "Движение",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-02",
        name: "Потанцевать под любимую песню",
        description:
          "Включи трек, от которого хочется двигаться. " +
          "Танцуй как получается — зрителей и оценок нет.",
        duration: 5,
        category: "Движение",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-03",
        name: "Чай в тишине",
        description:
          "Приготовь любимый чай или другой напиток. " +
          "Побудь с ним без ленты новостей и рабочих дел.",
        duration: 10,
        category: "Спокойствие",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-04",
        name: "Посидеть у окна и ничего не решать",
        description:
          "Устройся поудобнее и просто посмотри наружу. " +
          "Эту паузу не нужно превращать в полезное занятие.",
        duration: 5,
        category: "Спокойствие",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-05",
        name: "Послушать любимый альбом",
        description:
          "Выбери музыку под настроение. Можно закрыть " +
          "глаза, полежать или подпевать.",
        duration: null,
        category: "Удовольствие",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-06",
        name: "Почитать что-нибудь для удовольствия",
        description:
          "Открой рассказ, комикс или любимую книгу. " +
          "Без нормы страниц, конспекта и обязательств.",
        duration: 20,
        category: "Удовольствие",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-07",
        name: "Написать близкому человеку",
        description:
          "Отправь тёплое сообщение, смешную картинку " +
          "или простое «Как ты?». Не требуй немедленного ответа.",
        duration: 5,
        category: "Общение",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-08",
        name: "Позвонить тому, с кем хорошо",
        description:
          "Если обоим удобно, поболтайте без повестки " +
          "и необходимости решать какие-то вопросы.",
        duration: 15,
        category: "Общение",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-09",
        name: "Порисовать без цели",
        description:
          "Возьми бумагу и ручку. Рисуй линии, узоры " +
          "или забавных существ. Красиво получаться не обязано.",
        duration: 10,
        category: "Другое",
        favorite: false
      },
      {
        id: "lifegame-demo-treat-v1-10",
        name: "Посмотреть фотографии приятного дня",
        description:
          "Найди несколько снимков, с которыми связаны " +
          "хорошие воспоминания. Побудь в этом настроении.",
        duration: 10,
        category: "Другое",
        favorite: false
      }
    ];

    // Стабильные ID предотвращают дубли даже при повторном
    // запуске после ошибки записи служебной отметки.
    // Использованные, но удалённые примеры не восстанавливаем.
    const knownIds = new Set([
      ...state.treats.map(item => item.id),
      ...state.treatUses.map(use => use.treatId)
    ]);

    const missing = examples.filter(
      item => !knownIds.has(item.id)
    );

    let saved = true;

    if (missing.length) {
      saved = treatChange(data => {
        const existing = new Set([
          ...data.treats.map(item => item.id),
          ...data.treatUses.map(use => use.treatId)
        ]);

        for (const item of missing) {
          if (!existing.has(item.id)) {
            data.treats.push({ ...item });
            existing.add(item.id);
          }
        }
      });
    }

    // Отметку ставим только после успешного сохранения.
    if (!saved) return;

    try {
      localStorage.setItem(markerKey, "done");
    } catch (error) {
      console.warn(
        "Не удалось сохранить служебную отметку " +
        "демонстрационных ништяков.",
        error
      );
    }
  }

  // Инициализация только после объявления всех переменных.
  if (loadLatest()) {
    syncDay();
    seedDemoTreatsOnce();
  }
  render();
})();
</script>
