<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>LifeGame</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090909;
  --card: #141413;
  --border: #303029;
  --text: #f4f3e9;
  --muted: #99998c;
  --accent: #ffda29;
  --green: #acd8b8;
}
* { box-sizing: border-box; }
html {
  touch-action: manipulation;
  scroll-padding-top: calc(80px + env(safe-area-inset-top, 0px));
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select, textarea { font: inherit; }
button, a, label, input, select, textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus:not(:focus-visible) { outline: none; }
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.app {
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: auto;
  padding:
    calc(78px + env(safe-area-inset-top, 0px))
    16px
    calc(110px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: fixed;
  z-index: 20;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  max-width: 480px;
  min-height: calc(58px + env(safe-area-inset-top, 0px));
  padding:
    calc(12px + env(safe-area-inset-top, 0px))
    16px 12px;
  background: #10100f;
  border-bottom: 1px solid #ffda2933;
  box-shadow: 0 5px 18px #0005;
}
.brand {
  flex-shrink: 0;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 2px;
}
#wallet {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: 14px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
#wallet span { white-space: nowrap; }
.wallet-diamonds { color: var(--green); }
h1 {
  margin: 0 0 10px;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: .5px;
  overflow-wrap: anywhere;
}
h2 {
  margin-top: 0;
  font-size: 20px;
  overflow-wrap: anywhere;
}
p { color: var(--muted); line-height: 1.45; }
.hero { padding-top: 10px; text-align: center; }
.avatar {
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  margin: 0 auto 20px;
  border: 1px solid #ffda2960;
  border-radius: 24px;
  background: linear-gradient(145deg, #34301a, #151510 70%);
  color: var(--accent);
  font-size: 42px;
  font-weight: 900;
}
.level { font-size: 23px; font-weight: 850; letter-spacing: 2px; }
.progress {
  height: 6px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 3px;
  background: #2b2b25;
}
.progress-fill { height: 100%; background: var(--accent); }
.hero .progress { margin-top: 16px; }
.progress-label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
}
.center { text-align: center; }
.card {
  position: relative;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: inset 3px 0 0 #ffda291a;
}
.balances-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-top: 22px;
}
.balance { min-width: 0; padding: 16px 10px; text-align: center; }
.balance-number {
  color: var(--accent);
  font-size: 30px;
  line-height: 1.1;
  font-weight: 850;
  overflow-wrap: anywhere;
}
.diamond-balance .balance-number { color: var(--green); }
.label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
}
.list { display: grid; gap: 10px; margin-top: 14px; }
.block {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  min-height: 56px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  text-align: left;
  font-size: 14px;
  font-weight: 600;
}
.block span:first-child { overflow-wrap: anywhere; }
.arrow { color: var(--accent); font-size: 23px; }
.back {
  min-height: 40px;
  margin-bottom: 10px;
  padding: 0 10px 0 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 13px;
}
.empty {
  margin-top: 16px;
  padding: 18px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.task-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-height: 36px;
  padding-right: 40px;
}
.task-title {
  flex: 1;
  min-width: 0;
  padding-top: 7px;
  font-size: 16px;
  line-height: 1.3;
  font-weight: 750;
  overflow-wrap: anywhere;
  white-space: normal;
}
.meta {
  margin: 5px 0 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}
.reward {
  margin: 8px 0 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 650;
}
.compact-details {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin: 7px 0 12px;
  font-size: 12px;
  line-height: 1.4;
}
.detail-muted { color: var(--muted); }
.detail-reward { color: var(--accent); font-weight: 650; }
.actions, .form-actions { display: flex; gap: 8px; }
.actions { margin-top: 10px; }
.actions > button { flex: 1; }
.form-actions { flex-wrap: wrap; margin-top: 24px; }
.button {
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid #ffda2970;
  border-radius: 8px;
  background: #ffda290c;
  color: var(--accent);
  font-size: 14px;
  font-weight: 650;
}
.full { width: 100%; }
.button.secondary {
  border-color: var(--border);
  background: transparent;
  color: var(--muted);
  font-weight: 500;
}
.button:active:not(:disabled), .block:active {
  background: #ffda291c;
}
.spaced { margin-top: 12px; }
.hero-link {
  margin-top: 18px;
  background: var(--accent);
  color: #111108;
  font-weight: 800;
}
.hero-link:active:not(:disabled) { background: #ebc817; }
.backup-link { margin-top: 22px; }
.summary-link { margin-top: 10px; }
.more-button {
  flex-shrink: 0;
  min-width: 36px;
  min-height: 36px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 24px;
}
.card.done {
  border-color: #38382b;
  background: #111110;
  box-shadow: inset 3px 0 0 #ffda2933;
}
.done .task-title { color: #c0c0b3; }
.done .detail-reward { color: #b9a84e; }
.section-label {
  margin-top: 22px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
}
.favorite-bar {
  position: absolute;
  top: 10px;
  right: 10px;
}
.favorite-button {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: #77776a;
  font-size: 24px;
}
.favorite-button.is-favorite {
  color: var(--accent);
  background: #ffda290b;
  border-color: #ffda2938;
}
.check-label {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  cursor: pointer;
}
.check-label input {
  flex: 0 0 20px;
  width: 20px;
  height: 20px;
  min-height: 20px;
  margin: 0;
  accent-color: var(--accent);
}
.quest-reward-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 6px 0 8px;
}
.quest-reward-line .compact-details { flex: 1; min-width: 0; margin: 0; }
.quest-plan-toggle {
  flex-shrink: 0;
  min-height: 36px;
  margin: 0;
  gap: 6px;
  font-size: 11px;
  white-space: nowrap;
}
.quest-plan-toggle input {
  flex-basis: 18px;
  width: 18px;
  height: 18px;
  min-height: 18px;
}
.block-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.block-heading h1 { flex: 1; min-width: 0; }
.block-create-actions { display: grid; gap: 10px; margin-top: 14px; }
.card.goal-card {
  border-color: #52765b;
  background: #142019;
  box-shadow: inset 3px 0 0 #79a985;
}
.active-goal { margin-top: 14px; }
.goal-card .task-head { padding-right: 0; }
.goal-label {
  color: #a4c9ae;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}
.goal-card .task-title { color: #e0eee3; }
.goal-card .reward { color: #a9dfb9; }
.goal-card .button, .button.goal-button {
  border-color: #89bd9770;
  background: #89bd9710;
  color: #c0e6ca;
}
.card.goal-card.done {
  background: #111a14;
  border-color: #3d5743;
  box-shadow: inset 3px 0 0 #52765b;
}
.goal-card .meta { color: #94af9b; }
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.summary-row:last-child { border-bottom: 0; }
.summary-row span { color: var(--muted); }
.summary-row strong { text-align: right; }
.summary-total { color: var(--accent); }
nav {
  position: fixed;
  z-index: 10;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  width: 100%;
  max-width: 480px;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid #ffda292b;
  background: #10100f;
}
.nav-button {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  min-width: 0;
  min-height: 50px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #8f8f81;
  font-size: 10px;
}
.nav-icon { font-size: 20px; }
.nav-button.active {
  color: var(--accent);
  background: #ffda2910;
  box-shadow: inset 0 2px 0 var(--accent);
}
dialog {
  width: calc(100% - 32px);
  max-width: 440px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #ffda2940;
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
}
dialog::backdrop { background: #000b; }
label:not(.check-label) {
  display: block;
  margin: 18px 0 8px;
  color: var(--muted);
  font-size: 14px;
}
input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0c0c0b;
  color: var(--text);
  font-size: 16px;
}
textarea { min-height: 160px; max-height: 30vh; resize: vertical; }
.menu-actions { display: grid; gap: 10px; margin-top: 18px; }
#backup-dialog > p { font-size: 13px; }
#backup-dialog .form-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-top: 14px;
}
#backup-dialog .form-actions button {
  min-width: 0;
  width: 100%;
  padding: 10px 8px;
  font-size: 13px;
}
#close-backup { grid-column: 1 / -1; }
.sound-setting {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.sound-setting input {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  min-height: 0;
  padding: 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.settings-danger {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.settings-danger h3 { margin: 0 0 8px; font-size: 14px; }
.settings-danger p { font-size: 12px; }
.button.danger {
  width: 100%;
  border-color: #ff797950;
  background: #ff797908;
  color: #ffaaaa;
}
#save-warning {
  color: #ffb4b4;
  font-size: 13px;
  line-height: 1.5;
}
.reward-toast {
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  display: grid;
  place-items: center;
  min-width: 210px;
  max-width: calc(100vw - 40px);
  min-height: 82px;
  padding: 18px 24px;
  border: 2px solid var(--accent);
  border-radius: 14px;
  background: #18180f;
  color: var(--accent);
  font-size: 25px;
  font-weight: 900;
  text-align: center;
  white-space: pre-line;
  line-height: 1.4;
  pointer-events: none;
  box-shadow: 0 0 0 9999px #0006, 0 0 35px #ffda2944;
  animation: reward-popup var(--duration, 1700ms) ease-out forwards;
}
.reward-toast.level-up,
.reward-toast.day-bonus-toast {
  min-width: 250px;
  background: #302b0d;
  color: #fff29a;
  border-color: #fff29a;
}
.reward-toast.goal-toast {
  min-width: 240px;
  background: #15271b;
  border-color: #96caa4;
  color: #c0e6ca;
  font-size: 23px;
}
@keyframes reward-popup {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.85); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
  24%, 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.97); }
}
@media (max-width: 390px) {
  .quest-reward-line { flex-direction: column; align-items: flex-start; gap: 3px; }
  .reward-toast { font-size: 21px; }
}
@media (max-width: 350px) {
  .brand { font-size: 10px; letter-spacing: 1px; }
  #wallet { font-size: 12px; gap: 4px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .reward-toast { animation-name: reward-fade; }
  @keyframes reward-fade {
    0%, 85% { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -50%); }
  }
}
</style>
<style>
  .card.diamond-shop-card {
    border-color: #52765b;
    box-shadow: inset 3px 0 0 #79a98555;
  }

  .diamond-shop-card .reward {
    color: var(--green);
  }

  .diamond-shop-card .button:not(.secondary) {
    border-color: #89bd9770;
    background: #89bd9710;
    color: #c0e6ca;
  }
</style>
<style>
  /* Смысл — спокойный бордовый, не сигнальный красный. */
  .card.meaning-card {
    margin-top: 14px;
    padding: 12px 14px 16px;
    border-color: #74454d;
    background: #24171b;
    box-shadow: inset 3px 0 0 #a96a76;
  }

  .meaning-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 36px;
    margin-bottom: 4px;
  }

  .meaning-label {
    color: #d6a5af;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  .meaning-heading .more-button {
    color: #c797a2;
  }

  .meaning-text {
    color: #f0dce1;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .button.meaning-button {
    border-color: #b67c8970;
    background: #b67c890c;
    color: #e4b7c1;
  }

  .button.meaning-button:active:not(:disabled) {
    background: #b67c891c;
  }

  textarea.meaning-input {
    min-height: 160px;
    max-height: 40vh;
    font-size: 16px;
    line-height: 1.5;
  }
</style>
<style>
  .game-visual {
    position: relative;
    width: 100%;
    margin: 8px auto 22px;
    padding: 8px 0;
    overflow: hidden;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-word {
    display: block;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: clamp(66px, 21vw, 100px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -3px;
    white-space: nowrap;
  }

  /* Основа: только жёлтый контур */
  .game-outline {
    color: transparent;
    -webkit-text-stroke: 1.5px var(--accent);
  }

  /* Второй такой же текст: жёлтая заливка */
  .game-fill {
    position: absolute;
    inset: 8px 0;
    color: var(--accent);
    -webkit-text-stroke: 1.5px var(--accent);
    clip-path: inset(0 var(--game-unfilled, 100%) 0 0);
  }

  .game-caption {
    margin: -10px 0 20px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: no-preference) {
    .game-fill {
      transition: clip-path .5s ease;
    }
  }
</style>
<style>
  .game-visual {
    margin: 8px auto 24px;
  }

    .game-word {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: clamp(54px, 17vw, 78px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 6px;
    text-indent: 6px;
  }

  .game-outline {
    color: transparent;
    -webkit-text-stroke: 1.2px var(--accent);
  }

  .game-fill {
    color: var(--accent);
    -webkit-text-stroke: 1.2px var(--accent);
  }
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <span class="brand">LIFE / GAME</span>
    <span id="wallet" aria-live="polite"></span>
  </header>
  <p id="save-warning" role="alert" hidden></p>
  <main id="screen"></main>
</div>

<nav aria-label="Главное меню">
  <button type="button" class="nav-button" data-page="hero">
    <span class="nav-icon" aria-hidden="true">◉</span>Герой
  </button>
  <button type="button" class="nav-button" data-page="blocks">
    <span class="nav-icon" aria-hidden="true">▦</span>Блоки
  </button>
  <button type="button" class="nav-button" data-page="quests">
    <span class="nav-icon" aria-hidden="true">◇</span>Квесты
  </button>
  <button type="button" class="nav-button" data-page="bonuses">
    <span class="nav-icon" aria-hidden="true">✧</span>Бонусы
  </button>
</nav>

<dialog id="editor" aria-labelledby="editor-title"></dialog>
<dialog id="menu" aria-labelledby="menu-title"></dialog>

<dialog id="backup-dialog" aria-labelledby="backup-title">
  <h2 id="backup-title">Настройки</h2>
  <label class="check-label sound-setting" for="sound-enabled">
    <span>Звуки</span>
    <input type="checkbox" role="switch" id="sound-enabled" checked>
  </label>
  <p>
    Создай копию и сохрани весь текст вне приложения.
    Для восстановления вставь ранее сохранённую копию.
  </p>
  <button type="button" class="button full" id="generate-backup">
    Создать копию
  </button>
  <label for="backup-text">Данные сохранения</label>
  <textarea id="backup-text" spellcheck="false"
            autocapitalize="off" autocomplete="off"></textarea>
  <div class="form-actions">
    <button type="button" class="button" id="copy-backup">Копировать</button>
    <button type="button" class="button secondary" id="restore-backup">
      Восстановить
    </button>
    <button type="button" class="button secondary" id="close-backup">
      Закрыть
    </button>
  </div>
  <section class="settings-danger">
    <h3>Полный сброс</h3>
    <p>
      Удалит задания, квесты, цели, покупки, монеты и алмазы.
      Вернёт восемь стартовых блоков.
      Сначала сохрани резервную копию вне приложения.
    </p>
    <button type="button" class="button danger" id="reset-data">
      Сбросить все данные
    </button>
  </section>
  <p id="backup-status" role="status"></p>
</dialog>

<script>
"use strict";

(() => {
  const STORAGE_KEY = "lifegame-prototype-v1";
  const MIN_DAY_TASKS = 3;
  const DAY_REWARD = 100;
  const LEVEL_COST = 1000;

  const DEFAULT_NAMES = [
    "Душевное состояние",
    "Физическое состояние",
    "Знания, навыки, опыт",
    "Ресурсы и материальное",
    "Окружение и отношения",
    "Наполнение и организация",
    "Обстоятельства",
    "Исключить"
  ];

  const $ = id => document.getElementById(id);
  const screen = $("screen");
  const wallet = $("wallet");
  const warning = $("save-warning");
  const editor = $("editor");
  const menu = $("menu");
  const settings = $("backup-dialog");
  const backupText = $("backup-text");
  const backupStatus = $("backup-status");
  const soundToggle = $("sound-enabled");

  let state = emptyState();
  let snapshot = null;
  let healthy = true;
  let page = "hero";
  let blockId = null;
  let view;
  let audioContext = null;
  const activeSounds = new Map();
  const effects = [];
  let effectRunning = false;
  let effectTimer = null;

  function emptyState() {
    return {
      soundEnabled: true,
      blocks: DEFAULT_NAMES.map((name, index) => ({
        id: "block-" + index, name
      })),
      goals: [],
      diamondRecords: [],
      tasks: [],
      quests: [],
      bonuses: [],
      completions: [],
      purchases: [],
      dayPlans: {},
      dayPlanDate: null
    };
  }

  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function fail(message) { throw new Error(message); }
  function integer(value, min, max) {
    return Number.isSafeInteger(value) && value >= min && value <= max;
  }
  function validId(value) {
    return typeof value === "string" && value.length > 0;
  }
  function validName(value) {
    return typeof value === "string" &&
      value.trim().length > 0 && value.length <= 120;
  }
  function uid() {
    if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return Array.from(
      crypto.getRandomValues(new Uint8Array(16)),
      value => value.toString(16).padStart(2, "0")
    ).join("");
  }
  function dateKey(date = new Date()) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }
  function today() { return dateKey(); }
  function dateLabel() {
    return new Date().toLocaleDateString("ru-RU", {
      day: "numeric", month: "long"
    });
  }
  function validDate(value) {
    if (typeof value !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const date = new Date(value + "T12:00:00Z");
    return Number.isFinite(date.getTime()) &&
      date.toISOString().slice(0, 10) === value;
  }
  function sum(list, key) {
    return list.reduce((total, item) => total + item[key], 0);
  }
    function totals(data) {
    const earned = sum(data.completions, "reward");

    const spent = sum(
      data.purchases.filter(
        purchase => purchase.currency !== "diamonds"
      ),
      "price"
    );

    const diamondsEarned = sum(data.diamondRecords, "amount");

    const diamondsSpent = sum(
      data.purchases.filter(
        purchase => purchase.currency === "diamonds"
      ),
      "price"
    );

    return {
      earned,
      spent,
      balance: earned - spent,
      diamondsEarned,
      diamondsSpent,
      diamonds: diamondsEarned - diamondsSpent
    };
  }

  // Проверка данных и перенос старых числовых блоков.
  function normalize(raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw) ||
        !Array.isArray(raw.tasks) || !Array.isArray(raw.completions)) {
      fail("Неверная структура сохранения.");
    }

    const data = clone(raw);
    if (data.soundEnabled === undefined) data.soundEnabled = true;
    if (typeof data.soundEnabled !== "boolean") {
      fail("Некорректная настройка звуков.");
    }

    if (data.blocks === undefined) {
      data.blocks = emptyState().blocks;
      for (const task of data.tasks) {
        if (integer(task.block, 0, 7)) task.block = "block-" + task.block;
      }
    }

    for (const key of [
      "quests", "bonuses", "purchases", "goals", "diamondRecords"
    ]) {
      if (data[key] === undefined) data[key] = [];
    }

    for (const key of [
      "blocks", "tasks", "quests", "bonuses", "purchases",
      "completions", "goals", "diamondRecords"
    ]) {
      if (!Array.isArray(data[key])) fail("Повреждён список: " + key);
      const ids = new Set();
      for (const item of data[key]) {
        if (!item || typeof item !== "object" ||
            !validId(item.id) || ids.has(item.id)) {
          fail("Повреждены записи: " + key);
        }
        ids.add(item.id);
      }
    }

        const blocks = new Set();

    for (const item of data.blocks) {
      if (!validName(item.name)) {
        fail("Некорректное название блока.");
      }

      // В существующих блоках смысл изначально пустой.
      if (item.meaning === undefined) {
        item.meaning = "";
      }

      if (
        typeof item.meaning !== "string" ||
        item.meaning.length > 2000
      ) {
        fail("Некорректный текст смысла блока.");
      }

      item.meaning = item.meaning.trim();

      blocks.add(item.id);
    }

    function bool(item, key) {
      if (item[key] === undefined) item[key] = false;
      if (typeof item[key] !== "boolean") fail("Некорректное поле: " + key);
    }

    for (const task of data.tasks) {
      if (!validName(task.name) || !blocks.has(task.block) ||
          !["once", "daily"].includes(task.type) ||
          !integer(task.reward, 1, 100000)) {
        fail("Повреждены данные задания.");
      }
      bool(task, "favorite");
    }

    const recordKeys = new Set();
    for (const record of data.completions) {
      if (!validId(record.taskId) || !validDate(record.date) ||
          !integer(record.reward, 1, 100000)) {
        fail("Повреждена история монет.");
      }
      const key = JSON.stringify([record.taskId, record.date]);
      if (recordKeys.has(key)) fail("Повторное начисление монет.");
      recordKeys.add(key);

      if (record.sourceCompletionIds !== undefined &&
          (!Array.isArray(record.sourceCompletionIds) ||
           !record.sourceCompletionIds.every(validId) ||
           new Set(record.sourceCompletionIds).size !==
             record.sourceCompletionIds.length)) {
        fail("Повреждены связи бонуса дня.");
      }
    }

    const recordsById = new Map(data.completions.map(x => [x.id, x]));

    for (const quest of data.quests) {
      if (!validName(quest.name) ||
          !integer(quest.target, 1, 1000000) ||
          !integer(quest.progress, 0, quest.target) ||
          !integer(quest.step, 1, 1000000) ||
          !integer(quest.reward, 1, 100000)) {
        fail("Повреждены данные квеста.");
      }
      bool(quest, "favorite");
      bool(quest, "showInDay");
      if (quest.stepReward === undefined) quest.stepReward = 0;
      if (quest.stepHistory === undefined) quest.stepHistory = [];
      if (!integer(quest.stepReward, 0, 100000) ||
          !Array.isArray(quest.stepHistory)) fail("Повреждена история квеста.");

      let previousTo = null;
      const paymentIds = new Set();
      for (const entry of quest.stepHistory) {
        if (!entry || !integer(entry.from, 0, quest.target) ||
            !integer(entry.to, 1, quest.target) ||
            entry.to <= entry.from ||
            (previousTo !== null && entry.from !== previousTo)) {
          fail("Нарушена последовательность шагов.");
        }
        previousTo = entry.to;
        if (entry.completionId === undefined) entry.completionId = null;
        if (entry.completionId !== null) {
          const payment = recordsById.get(entry.completionId);
          if (!payment || paymentIds.has(entry.completionId) ||
              payment.taskId !==
                `quest:step:${quest.id}:${entry.completionId}`) {
            fail("Повреждена связь шага с наградой.");
          }
          paymentIds.add(entry.completionId);
        }
      }
      if (quest.stepHistory.length && previousTo !== quest.progress) {
        fail("История не соответствует прогрессу квеста.");
      }
    }

    for (const bonus of data.bonuses) {
            if (bonus.currency === undefined) {
        bonus.currency = "coins";
      }

      if (!["coins", "diamonds"].includes(bonus.currency)) {
        fail("Некорректная валюта бонуса.");
      }
      if (bonus.description === undefined) bonus.description = "";
      if (!validName(bonus.name) ||
          typeof bonus.description !== "string" ||
          bonus.description.length > 300 ||
          !integer(bonus.price, 1, 1000000)) fail("Повреждены данные бонуса.");
      bool(bonus, "favorite");
    }

    for (const purchase of data.purchases) {
            if (purchase.currency === undefined) {
        purchase.currency = "coins";
      }

      if (!["coins", "diamonds"].includes(purchase.currency)) {
        fail("Некорректная валюта покупки.");
      }
      if (!validName(purchase.name) || !validId(purchase.bonusId) ||
          !integer(purchase.price, 1, 1000000) ||
          typeof purchase.createdAt !== "string" ||
          !Number.isFinite(Date.parse(purchase.createdAt))) {
        fail("Повреждена история покупок.");
      }
    }

    const activeBlocks = new Set();
    for (const goal of data.goals) {
      if (goal.completedDate === undefined) goal.completedDate = null;
      if (!validName(goal.name) || !blocks.has(goal.blockId) ||
          !integer(goal.diamonds, 1, 100000) ||
          (goal.completedDate !== null && !validDate(goal.completedDate))) {
        fail("Повреждены данные цели.");
      }
      if (goal.completedDate === null) {
        if (activeBlocks.has(goal.blockId)) {
          fail("В блоке может быть только одна активная цель.");
        }
        activeBlocks.add(goal.blockId);
      }
    }

    const diamondGoals = new Map();
    for (const record of data.diamondRecords) {
      if (!validId(record.goalId) || !validDate(record.date) ||
          !integer(record.amount, 1, 100000) ||
          diamondGoals.has(record.goalId)) {
        fail("Повреждена история алмазов.");
      }
      diamondGoals.set(record.goalId, record);
    }

    for (const goal of data.goals) {
      const reward = diamondGoals.get(goal.id);
      if (goal.completedDate === null && reward) {
        fail("У активной цели уже начислена награда.");
      }
      if (goal.completedDate !== null &&
          (!reward || reward.amount !== goal.diamonds ||
           reward.date !== goal.completedDate)) {
        fail("Награда цели не соответствует истории.");
      }
    }

    if (data.dayPlans === undefined) data.dayPlans = {};
    if (!data.dayPlans || typeof data.dayPlans !== "object" ||
        Array.isArray(data.dayPlans)) fail("Повреждены планы дня.");
    for (const [date, ids] of Object.entries(data.dayPlans)) {
      if (!validDate(date) || !Array.isArray(ids) ||
          !ids.every(validId) || new Set(ids).size !== ids.length) {
        fail("Повреждён план дня.");
      }
    }
    if (data.dayPlanDate === undefined) data.dayPlanDate = null;
    if (data.dayPlanDate !== null && !validDate(data.dayPlanDate)) {
      fail("Некорректная дата плана.");
    }

        const money = totals(data);

    const amounts = [
      money.earned,
      money.spent,
      money.balance,
      money.diamondsEarned,
      money.diamondsSpent,
      money.diamonds
    ];

    if (!amounts.every(
      value => Number.isSafeInteger(value) && value >= 0
    )) {
      fail("Некорректный баланс монет или алмазов.");
    }

    return data;
  }

  function storageError(message) {
    healthy = false;
    warning.hidden = false;
    warning.textContent = message;
  }

  function loadLatest() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw !== snapshot) {
        const loaded = raw === null ? emptyState() : normalize(JSON.parse(raw));
        state = loaded;
        syncSoundSetting();
        snapshot = raw;
      }
      return true;
    } catch (error) {
      storageError("Не удалось прочитать данные. Не очищай хранилище. " +
        error.message);
      return false;
    }
  }

  function ensureDay(data) {
    const date = today();
    if (!Object.hasOwn(data.dayPlans, date)) {
      const dates = Object.keys(data.dayPlans).filter(x => x < date).sort();
      const previous = dates[dates.length - 1];
      const ids = new Set(previous ? data.dayPlans[previous] : []);
      data.dayPlans[date] = data.tasks
        .filter(task => task.type === "daily" && ids.has(task.id))
        .map(task => task.id);
    }
    data.dayPlanDate = date;
  }

  function plannedTasks(data) {
    const ids = new Set(data.dayPlans[today()] || []);
    return data.tasks.filter(task => ids.has(task.id));
  }

  function completion(data, task, todayOnly = false) {
    return data.completions.find(record =>
      record.taskId === task.id &&
      ((!todayOnly && task.type === "once") || record.date === today())
    );
  }

  function addRecord(data, taskId, reward, extra = {}) {
    const record = { id: uid(), taskId, date: today(), reward, ...extra };
    data.completions.push(record);
    return record;
  }

  function reconcileDayBonus(data) {
    const ids = new Set(data.completions.map(x => x.id));
    data.completions = data.completions.filter(record =>
      !record.taskId.startsWith("day-bonus:") ||
      !Array.isArray(record.sourceCompletionIds) ||
      record.sourceCompletionIds.every(id => ids.has(id))
    );

    const key = "day-bonus:" + today();
    if (data.completions.some(x => x.taskId === key)) return;
    const tasks = plannedTasks(data);
    if (tasks.length < MIN_DAY_TASKS) return;
    const records = tasks.map(task => completion(data, task, true));
    if (records.some(x => !x)) return;
    addRecord(data, key, DAY_REWARD, {
      sourceCompletionIds: records.map(x => x.id)
    });
  }

  function transact(change, awardDayBonus = true) {
    if (!healthy) {
      alert("Изменения отключены из-за ошибки хранилища.");
      return false;
    }

    try {
      if (localStorage.getItem(STORAGE_KEY) !== snapshot) {
        loadLatest();
        render();
        alert("Данные изменились в другой вкладке. Повтори действие.");
        return false;
      }
    } catch (error) {
      storageError("Хранилище недоступно: " + error.message);
      render();
      return false;
    }

    const before = totals(state);
    const beforeIds = new Set(state.completions.map(x => x.id));
    let next;

    try {
      const draft = clone(state);
      ensureDay(draft);
      change(draft);
      if (awardDayBonus) reconcileDayBonus(draft);
            const money = totals(draft);

      if (money.balance < 0) {
        fail(
          "Эти монеты уже потрачены. " +
          "Сначала отмени соответствующие покупки."
        );
      }

      if (money.diamonds < 0) {
        fail(
          "Эти алмазы уже потрачены. " +
          "Сначала отмени соответствующие покупки."
        );
      }

      next = normalize(draft);
    } catch (error) {
      alert(error.message);
      render();
      return false;
    }

    try {
      const serialized = JSON.stringify(next);
      localStorage.setItem(STORAGE_KEY, serialized);
      snapshot = serialized;
      state = next;
    } catch (error) {
      storageError("Сохранение не удалось. Действие не применено. " +
        error.message);
      render();
      return false;
    }

    // Ошибки эффектов не должны объявлять успешную запись неудачной.
    render();
    try {
      celebrateChanges(before, beforeIds);
    } catch (error) {
      console.warn("Эффект награды недоступен:", error);
    }
    return true;
  }

  function syncDay() {
    if (healthy && (state.dayPlanDate !== today() ||
        !Object.hasOwn(state.dayPlans, today()))) {
      transact(() => {}, false);
    }
  }

  // Звуки и последовательные уведомления.
  function syncSoundSetting() {
    soundToggle.checked = state.soundEnabled;
    soundToggle.disabled = !healthy;
    if (state.soundEnabled) return;
    for (const [oscillator, gain] of activeSounds) {
      gain.disconnect();
      try {
        oscillator.stop();
      } catch (error) {
        console.warn("Остановка звука недоступна:", error);
      }
    }
    activeSounds.clear();
  }

  function primeAudio() {
    if (!state.soundEnabled) return;
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      if (!audioContext) audioContext = new Audio();
      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }
    } catch (error) {
      console.warn("Аудио недоступно:", error);
    }
  }

  function tones(frequencies, interval = .12, duration = .25, volume = .12) {
    if (!state.soundEnabled) return;
    try {
      primeAudio();
      if (!audioContext) return;
      const now = audioContext.currentTime;
      frequencies.forEach((frequency, index) => {
        const start = now + interval * index;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        activeSounds.set(oscillator, gain);
        oscillator.onended = () => {
          activeSounds.delete(oscillator);
          oscillator.disconnect();
          gain.disconnect();
        };
        oscillator.start(start);
        oscillator.stop(start + duration + .03);
      });
    } catch (error) {
      console.warn("Звук недоступен:", error);
    }
  }

  function enqueueEffect(type, value) {
    primeAudio();
    effects.push({ type, value });
    runEffect();
  }

  function runEffect() {
    if (effectRunning || !effects.length || document.hidden) return;
    effectRunning = true;

    const event = effects.shift();
    const toast = el("div", "reward-toast");
    let duration = 1700;

    if (event.type === "coins") {
      toast.textContent = `+${event.value} монет`;
      tones([880, 1175, 1480], .07, .16);
    } else if (event.type === "day") {
      duration = 4000;
      toast.classList.add("day-bonus-toast");
      toast.textContent = `★ БОНУС ДНЯ\n+${event.value} МОНЕТ`;
      tones([523.25, 659.25, 783.99, 1046.5], .14, .5, .14);
    } else if (event.type === "goal") {
      duration = 2800;
      toast.classList.add("goal-toast");
      toast.textContent = `✓ ЦЕЛЬ ДОСТИГНУТА\n+${event.value} ◆`;
      tones([659.25, 783.99, 1046.5], .16, .45, .13);
    } else if (event.type === "level") {
      duration = 3600;
      toast.classList.add("level-up");
      toast.textContent = `★ УРОВЕНЬ ${event.value}`;
      tones([523.25, 659.25, 783.99, 1046.5], .15, .45, .14);
    }

    toast.style.setProperty("--duration", duration + "ms");
    document.body.append(toast);

    effectTimer = setTimeout(() => {
      toast.remove();
      effectRunning = false;
      runEffect();
    }, duration + 100);
  }

  function clearEffects() {
    effects.length = 0;
    clearTimeout(effectTimer);
    effectRunning = false;
    document.querySelectorAll(".reward-toast").forEach(x => x.remove());
  }

  function celebrateChanges(before, beforeIds) {
    const after = totals(state);
    const bonus = state.completions.find(record =>
      !beforeIds.has(record.id) && record.taskId.startsWith("day-bonus:")
    );
    const regular = after.earned - before.earned - (bonus ? bonus.reward : 0);
    if (regular > 0) enqueueEffect("coins", regular);
    if (bonus) enqueueEffect("day", bonus.reward);
        const diamondsAwarded =
      after.diamondsEarned - before.diamondsEarned;

    if (diamondsAwarded > 0) {
      enqueueEffect("goal", diamondsAwarded);
    }
    const oldLevel = Math.floor(before.earned / LEVEL_COST) + 1;
    const newLevel = Math.floor(after.earned / LEVEL_COST) + 1;
    if (newLevel > oldLevel) enqueueEffect("level", newLevel);
  }

  // Общие элементы интерфейса.
  function el(tag, className = "", text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function btn(text, className, action, mutating = false) {
    const node = el("button", className, text);
    node.type = "button";
    node.disabled = mutating && !healthy;
    node.addEventListener("click", action);
    return node;
  }

  function go(nextPage, selectedBlock = null) {
    syncDay();
    page = nextPage;
    blockId = selectedBlock;
    render();
    window.scrollTo(0, 0);
  }

  function progressBar(value, max, label) {
    const bar = el("div", "progress");
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-label", label);
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(max));
    bar.setAttribute("aria-valuenow", String(value));
    const fill = el("div", "progress-fill");
    fill.style.width = `${max ? value / max * 100 : 0}%`;
    bar.append(fill);
    return bar;
  }

  function balancesPanel() {
    const panel = el("div", "balances-grid");
    for (const [value, label, className] of [
      [view.money.balance, "МОНЕТЫ", ""],
      [view.money.diamonds, "АЛМАЗЫ", " diamond-balance"]
    ]) {
      const card = el("div", "card balance" + className);
      card.append(
        el("div", "balance-number", String(value)),
        el("div", "label", label)
      );
      panel.append(card);
    }
    return panel;
  }

  function section(title, items, builder) {
    if (!items.length) return;
    if (title) screen.append(el("div", "section-label", title));
    const list = el("div", "list");
    for (const item of items) list.append(builder(item));
    screen.append(list);
  }

  function favorites(items) {
    return [...items].sort((a, b) => Number(!!b.favorite) - Number(!!a.favorite));
  }

  function favoriteBar(collection, item) {
    const bar = el("div", "favorite-bar");
    const star = btn(
      item.favorite ? "★" : "☆",
      "favorite-button" + (item.favorite ? " is-favorite" : ""),
      () => transact(data => {
        const actual = data[collection].find(x => x.id === item.id);
        if (!actual) fail("Элемент не найден.");
        actual.favorite = !actual.favorite;
      }, false),
      true
    );
    star.setAttribute("aria-pressed", String(!!item.favorite));

        }
      } else {
        input.type = field.type || "text";
        for (const key of ["min", "max", "step", "maxLength"]) {
          if (field[key] !== undefined) input[key] = field[key];
        }
      }
      input.required = field.required !== false;

      inputs[field.key] = input;

      if (field.hint) form.append(el("p", "meta", field.hint));

          : inputs[field.key].value.trim();

  function configureStepReward(id) {
    const quest = state.quests.find(x => x.id === id);
    if (!quest) return;
    openForm("Награда за продвижение", [
      {
        ...numberField("stepReward", "Монет за одно нажатие «+»",
          quest.stepReward, 100000, 0),
        hint: "Изменение действует только на следующие продвижения."
      }
    ], values => transact(data => {
      const actual = data.quests.find(x => x.id === id);
      if (!actual) fail("Квест не найден.");
      actual.stepReward = values.stepReward;
    }, false), "Сохранить");
  }

  function moveQuest(id, direction) {
    if (direction < 0 && !confirm(
      "Отменить последнее продвижение? Его награда, а при необходимости " +
      "и награда за достижение, будут убраны."
    )) return;

    transact(data => {
      const quest = data.quests.find(x => x.id === id);
      if (!quest) fail("Квест не найден.");
      const last = quest.stepHistory[quest.stepHistory.length - 1];
      const next = direction > 0
        ? Math.min(quest.target, quest.progress + quest.step)
        : last && last.to === quest.progress
          ? last.from : Math.max(0, quest.progress - quest.step);

      if (next === quest.progress) return;

      if (direction > 0) {
        let paymentId = null;
        if (quest.stepReward > 0) {
          paymentId = uid();
          addRecord(data, `quest:step:${id}:${paymentId}`,
            quest.stepReward, { id: paymentId });
        }
        quest.stepHistory.push({
          from: quest.progress, to: next, completionId: paymentId
        });
      } else if (last && last.to === quest.progress) {
        quest.stepHistory.pop();
        if (last.completionId) {
          data.completions = data.completions.filter(x => x.id !== last.completionId);
        }
      }

      quest.progress = next;
      const final = data.completions.find(x => x.taskId === "quest:" + id);
      if (next === quest.target && !final) {
        addRecord(data, "quest:" + id, quest.reward);
      }
      if (next < quest.target && final) {
        data.completions = data.completions.filter(x => x.id !== final.id);
      }
    }, false);
  }

  function questCard(quest, inDay = false) {
    const done = quest.progress >= quest.target;
    const card = el("article", "card" + (done ? " done" : ""));
    const rewards = el("div", "compact-details");
    if (quest.stepReward > 0) {
      rewards.append(el("span", "detail-reward",
        `За продвижение: +${quest.stepReward} монет`));
    }
    rewards.append(el("span", "detail-reward", done
      ? `✓ Достижение получено: +${quest.reward} монет`
      : `За достижение: +${quest.reward} монет`));

    const plan = checkbox("Конструктор дня", quest.showInDay,
      checked => transact(data => {
        const actual = data.quests.find(x => x.id === quest.id);
        if (!actual) fail("Квест не найден.");
        actual.showInDay = checked;
      }, false));
    plan.classList.add("quest-plan-toggle");

    const line = el("div", "quest-reward-line");
    line.append(rewards, plan);

    const minus = btn(`−${quest.step}`, "button secondary",
      () => moveQuest(quest.id, -1), true);
    const plus = btn(`+${quest.step}`, "button",
      () => moveQuest(quest.id, 1), true);
    minus.disabled = !healthy || quest.progress === 0;
    plus.disabled = !healthy || done;
    const actions = el("div", "actions");
    actions.append(minus, plus);

    card.append(
      favoriteBar("quests", quest),
      cardHead(quest, "quests", !inDay),
      line,
      progressBar(quest.progress, quest.target, quest.name),
      el("div", "progress-label",
        `${quest.progress} / ${quest.target}` + (done ? " · Завершён" : "")),
      actions
    );
    return card;
  }

    function buyBonus(id) {
    const ok = transact(data => {
      const bonus = data.bonuses.find(x => x.id === id);

      if (!bonus) {
        fail("Бонус не найден.");
      }

      if (data.purchases.some(x => x.bonusId === id)) {
        fail("Этот бонус уже куплен.");
      }

      const money = totals(data);
      const isDiamonds = bonus.currency === "diamonds";

      const available = isDiamonds
        ? money.diamonds
        : money.balance;

      if (available < bonus.price) {
        fail(
          isDiamonds
            ? "Недостаточно алмазов."
            : "Недостаточно монет."
        );
      }

      data.purchases.push({
        id: uid(),
        bonusId: id,
        name: bonus.name,
        price: bonus.price,
        currency: bonus.currency,
        createdAt: new Date().toISOString()
      });
    }, false);

    if (ok) {
      tones([392, 523.25, 659.25], .12, .3);
    }
  }

    function bonusCard(bonus) {
    const isDiamonds = bonus.currency === "diamonds";

    const available = isDiamonds
      ? view.money.diamonds
      : view.money.balance;

    const missing = Math.max(0, bonus.price - available);
    const symbol = isDiamonds ? "◆" : "●";

    const card = el(
      "article",
      "card" + (isDiamonds ? " diamond-shop-card" : "")
    );

    card.append(
      favoriteBar("bonuses", bonus),
      cardHead(bonus, "bonuses")
    );

    if (bonus.description) {
      card.append(el("p", "", bonus.description));
    }

    const buy = btn(
      missing
        ? `Не хватает ${missing} ${symbol}`
        : "Купить",
      "button full" + (missing ? " secondary" : ""),
      () => buyBonus(bonus.id),
      true
    );

    buy.disabled = !healthy || missing > 0;

    card.append(
      el("div", "reward", `${bonus.price} ${symbol}`),
      buy
    );

    return card;
  }

    function purchaseCard(purchase) {
    const isDiamonds = purchase.currency === "diamonds";
    const symbol = isDiamonds ? "◆" : "●";

    const card = el(
      "article",
      "card" + (isDiamonds ? " diamond-shop-card" : "")
    );

    card.append(
      el("div", "task-title", purchase.name),

      el(
        "div",
        "meta",
        new Date(purchase.createdAt).toLocaleString("ru-RU", {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit"
        })
      ),

      el("div", "reward", `−${purchase.price} ${symbol}`),

      btn(
        "Отменить покупку",
        "button secondary full",
        () => {
          if (!confirm(
            `Отменить покупку и вернуть ${purchase.price} ${symbol}?`
          )) {
            return;
          }

          transact(data => {
            if (!data.purchases.some(x => x.id === purchase.id)) {
              fail("Покупка уже отменена.");
            }

            data.purchases = data.purchases.filter(
              x => x.id !== purchase.id
            );
          }, false);
        },
        true
      )
    );

    return card;
  }

  // Экраны.
  function buildView() {
    const date = today();
    const anyTask = new Map();
    const todayTask = new Map();
    const recordsToday = [];
    for (const record of state.completions) {
      if (!anyTask.has(record.taskId)) anyTask.set(record.taskId, record);
      if (record.date === date) {
        todayTask.set(record.taskId, record);
        recordsToday.push(record);
      }
    }
    const planIds = new Set(state.dayPlans[date] || []);
    const planned = state.tasks.filter(x => planIds.has(x.id));
    return {
      anyTask, todayTask, recordsToday, planIds, planned,
      plannedDone: planned.filter(x => todayTask.has(x.id)),
      bonus: todayTask.get("day-bonus:" + date),
      money: totals(state)
    };
  }
  function gameVisual(earned) {
    const target = 10000;

    const percent = Math.min(
      100,
      Math.max(0, earned / target * 100)
    );

    const visual = el("div", "game-visual");

    visual.setAttribute("role", "img");
    visual.setAttribute(
      "aria-label",
      `GAME: заполнено на ${Math.round(percent)} процентов. ` +
      `Заработано ${earned} из ${target} монет.`
    );

    const outline = el(
      "span",
      "game-word game-outline",
      "GAME"
    );

    const fill = el(
      "span",
      "game-word game-fill",
      "GAME"
    );

    outline.setAttribute("aria-hidden", "true");
    fill.setAttribute("aria-hidden", "true");

    fill.style.setProperty(
      "--game-unfilled",
      `${100 - percent}%`
    );

    visual.append(outline, fill);

    return visual;
  }
  
  function renderHero() {
    const hero = el("section", "hero");
    const progress = view.money.earned % LEVEL_COST;
    hero.append(
            gameVisual(view.money.earned),

      
      el("div", "level", `УРОВЕНЬ ${Math.floor(view.money.earned / LEVEL_COST) + 1}`),
      progressBar(progress, LEVEL_COST, "Прогресс уровня"),
      el("div", "progress-label", `${progress} / ${LEVEL_COST} до следующего уровня`),
      balancesPanel()
    );
    screen.append(
      hero,
      btn("Конструктор дня →", "button full hero-link", () => go("day")),
      el("div", "progress-label center", view.planned.length
        ? `Выполнено ${view.plannedDone.length} из ${view.planned.length}` +
          (view.bonus ? ` · Бонус +${view.bonus.reward} получен` : "")
        : "Выбери действия на сегодня"),
      btn("Настройки", "button secondary full backup-link", () => {
        backupStatus.textContent = "";
        settings.showModal();
      }),
      btn("Итоги дня", "button secondary full summary-link", () => go("summary"))
    );
  }

  function renderBlocks() {
    if (blockId === null) {
      screen.append(
        el("h1", "", "БЛОКИ"),
        el("p", "", "Выбери, чему посвятить время."),
        btn("+ Добавить блок", "button full", createBlock, true)
      );
      const list = el("div", "list");
      for (const block of state.blocks) {
        const open = btn("", "block", () => go("blocks", block.id));
        open.append(el("span", "", block.name), el("span", "arrow", "›"));
        list.append(open);
      }
      screen.append(list);
      if (!state.blocks.length) {
        screen.append(el("div", "empty", "Создай первый блок."));
      }
      return;
    }

    const selected = state.blocks.find(x => x.id === blockId);
    if (!selected) {
      blockId = null;
      renderBlocks();
      return;
    }

    screen.append(btn("← Все блоки", "back", () => go("blocks")));
    const heading = el("div", "block-heading");
    const more = btn("⋯", "more-button", () => blockMenu(selected.id));
    more.setAttribute("aria-label", "Настройки блока");
        heading.append(el("h1", "", selected.name), more);
    screen.append(heading);

    // Смысл всегда расположен над целью и заданиями.
    screen.append(meaningCard(selected));

    const goals = state.goals.filter(x => x.blockId === blockId);
    const active = goals.find(x => x.completedDate === null);
    if (active) screen.append(goalCard(active));

        const create = el("div", "block-create-actions");

    // Сначала цель, если активной цели ещё нет.
    if (!active) {
      create.append(
        btn(
          "+ Добавить цель",
          "button full goal-button",
          () => goalForm(),
          true
        )
      );
    }

    // Затем задания.
    create.append(
      btn(
        "+ Добавить задание",
        "button full",
        createTask,
        true
      )
    );

    screen.append(create);

    const tasks = state.tasks.filter(x => x.block === blockId);
    const done = task => task.type === "once"
      ? view.anyTask.has(task.id) : view.todayTask.has(task.id);

    section("", favorites(tasks.filter(x => !done(x))), taskCard);

    const completed = [
      ...favorites(tasks.filter(done)).map(item => ({ kind: "task", item })),
      ...goals.filter(x => x.completedDate !== null).reverse()
        .map(item => ({ kind: "goal", item }))
    ];
    section("ВЫПОЛНЕНО", completed, entry =>
      entry.kind === "goal" ? goalCard(entry.item) : taskCard(entry.item));

    if (!tasks.length) {
      screen.append(el("div", "empty", "Пока заданий нет. Добавь первое."));
    }
  }

  function renderQuests() {
    screen.append(
      el("h1", "", "КВЕСТЫ"),
      el("p", "", "Большие цели — маленькими шагами."),
      btn("+ Добавить квест", "button full", createQuest, true)
    );
    section("", favorites(state.quests.filter(x => x.progress < x.target)),
      quest => questCard(quest));
    section("ЗАВЕРШЁННЫЕ",
      favorites(state.quests.filter(x => x.progress >= x.target)),
      quest => questCard(quest));
    if (!state.quests.length) {
      screen.append(el("div", "empty", "Добавь первый квест."));
    }
  }

  function renderBonuses() {
    screen.append(
      el("h1", "", "БОНУСЫ"),
      balancesPanel(),
      btn("+ Добавить бонус", "button full spaced", createBonus, true)
    );
    const bought = new Set(state.purchases.map(x => x.bonusId));
    const available = state.bonuses.filter(x => !bought.has(x.id));
    section("", favorites(available), bonusCard);
    if (!available.length) {
      screen.append(el("div", "empty", "Добавь награду и назначь ей цену."));
    }
    section("ИСТОРИЯ ПОКУПОК", [...state.purchases].reverse(), purchaseCard);
  }

  function renderDay() {
    screen.append(
      btn("← Герой", "back", () => go("hero")),
      el("h1", "", "КОНСТРУКТОР ДНЯ"),
      el("p", "", dateLabel())
    );
    const total = view.planned.length;
    const done = view.plannedDone.length;
    const summary = el("div", "card");
    const hint = el("p", "", view.bonus
      ? `✓ Бонус дня получен: +${view.bonus.reward} монет`
      : total < MIN_DAY_TASKS
        ? `Для бонуса нужно минимум ${MIN_DAY_TASKS} задания`
        : `Выполни весь план: +${DAY_REWARD} монет`);
    hint.style.marginBottom = "0";
    if (view.bonus) hint.style.color = "var(--accent)";
    summary.append(
      el("div", "task-title", `Выполнено ${done} из ${total}`),
      progressBar(total ? Math.round(done / total * 100) : 0, 100, "План дня"),
      hint
    );
    screen.append(summary);
    if (!total) {
      screen.append(el("div", "empty",
        "План пока пуст. Отметь нужные задания в блоках."));
    }
    section("ЗАДАНИЯ", favorites(view.planned.filter(
      x => !view.todayTask.has(x.id))), taskCard);

    const quests = state.quests.filter(x => x.showInDay);
    section("КВЕСТЫ", favorites(quests.filter(x => x.progress < x.target)),
      quest => questCard(quest, true));

    const completed = favorites([
      ...view.plannedDone.map(x => ({ ...x, kind: "task" })),
      ...quests.filter(x => x.progress >= x.target)
        .map(x => ({ ...x, kind: "quest" }))
    ]);
    section("ВЫПОЛНЕНО", completed, item =>
      item.kind === "quest" ? questCard(item, true) : taskCard(item));
  }

  function summaryRow(container, title, value, total = false) {
    const row = el("div", "summary-row");
    row.append(
      el("span", "", title),
      el("strong", total ? "summary-total" : "", String(value))
    );
    container.append(row);
  }

  function renderSummary() {
    screen.append(
      btn("← Герой", "back", () => go("hero")),
      el("h1", "", "ИТОГИ ДНЯ"),
      el("p", "", dateLabel())
    );
    const records = view.recordsToday;
    const tasks = records.filter(x =>
      !x.taskId.startsWith("quest:") && !x.taskId.startsWith("day-bonus:"));
    const steps = records.filter(x => x.taskId.startsWith("quest:step:"));
    const quests = records.filter(x =>
      x.taskId.startsWith("quest:") && !x.taskId.startsWith("quest:step:"));
    const bonuses = records.filter(x => x.taskId.startsWith("day-bonus:"));
    const diamonds = state.diamondRecords.filter(x => x.date === today());
        const purchasesToday = state.purchases.filter(
      x => dateKey(new Date(x.createdAt)) === today()
    );

    const spent = sum(
      purchasesToday.filter(x => x.currency !== "diamonds"),
      "price"
    );

    const diamondsSpent = sum(
      purchasesToday.filter(x => x.currency === "diamonds"),
      "price"
    );

    const activity = el("section", "card");
    const money = el("section", "card spaced");
    summaryRow(activity, "Выполнено заданий", tasks.length);
    summaryRow(activity, "План дня",
      `${view.plannedDone.length} из ${view.planned.length}`);
    summaryRow(activity, "Завершено квестов", quests.length);
    summaryRow(activity, "Достигнуто целей", diamonds.length);
    summaryRow(money, "За задания", `+${sum(tasks, "reward")}`);
    summaryRow(money, "За достижение квестов", `+${sum(quests, "reward")}`);
    summaryRow(money, "За продвижение квестов", `+${sum(steps, "reward")}`);
    summaryRow(money, "Бонус дня", `+${sum(bonuses, "reward")}`);
    summaryRow(money, "Всего заработано", `${sum(records, "reward")} монет`, true);
    summaryRow(money, "Потрачено монет", `${spent} ●`);
    summaryRow(money, "Потрачено алмазов", `${diamondsSpent} ◆`);
    summaryRow(money, "Алмазы за цели", `+${sum(diamonds, "amount")} ◆`, true);
    screen.append(activity, money);
  }

  function render() {
    syncSoundSetting();
    view = buildView();
    screen.replaceChildren();
    wallet.replaceChildren(
      el("span", "", `${view.money.balance} ●`),
      el("span", "wallet-diamonds", `${view.money.diamonds} ◆`)
    );
    wallet.setAttribute("aria-label",
      `Монеты: ${view.money.balance}. Алмазы: ${view.money.diamonds}.`);

    const active = ["day", "summary"].includes(page) ? "hero" : page;
    document.querySelectorAll(".nav-button").forEach(node => {
      const selected = node.dataset.page === active;
      node.classList.toggle("active", selected);
      if (selected) node.setAttribute("aria-current", "page");
      else node.removeAttribute("aria-current");
    });
    const screens = {
      hero: renderHero, blocks: renderBlocks, quests: renderQuests,
      bonuses: renderBonuses, day: renderDay, summary: renderSummary
    };
    (screens[page] || renderHero)();
  }

  // Настройки и резервные копии.
  soundToggle.addEventListener("change", () => {
    const enabled = soundToggle.checked;
    const saved = transact(data => {
      data.soundEnabled = enabled;
    }, false);
    syncSoundSetting();
    backupStatus.textContent = saved
      ? (enabled ? "Звуки включены." : "Звуки выключены.")
      : "Настройка звуков не сохранена.";
  });

  $("generate-backup").addEventListener("click", () => {
    if (!healthy || !loadLatest()) {
      backupStatus.textContent = "Ошибка сохранения. Не заменяй прежнюю копию.";
      return;
    }
    backupText.value = JSON.stringify({
      app: "LifeGame",
      version: 1,
      createdAt: new Date().toISOString(),
      data: state
    }, null, 2);
    render();
    backupStatus.textContent = "Копия готова. Сохрани весь текст вне приложения.";
  });

  $("copy-backup").addEventListener("click", async () => {
    if (!backupText.value.trim()) {
      backupStatus.textContent = "Сначала создай копию.";
      return;
    }
    try {
      await navigator.clipboard.writeText(backupText.value);
      backupStatus.textContent = "Скопировано. Вставь текст в надёжное место.";
    } catch {
      backupText.focus();
      backupText.select();
      backupStatus.textContent = "Скопируй выделенный текст вручную.";
    }
  });

  $("restore-backup").addEventListener("click", () => {
    try {
      const parsed = JSON.parse(backupText.value);
      if (!parsed || parsed.app !== "LifeGame" || parsed.version !== 1) {
        fail("Это не поддерживаемая копия LifeGame.");
      }
      const restored = normalize(parsed.data);
      if (!confirm(
        "Заменить текущие данные этой копией? Данные не объединяются."
      )) return;
      ensureDay(restored);
      const checked = normalize(restored);
      const serialized = JSON.stringify(checked);
      localStorage.setItem(STORAGE_KEY, serialized);
      clearEffects();
      state = checked;
      snapshot = serialized;
      healthy = true;
      warning.hidden = true;
      warning.textContent = "";
      page = "hero";
      blockId = null;
      render();
      backupStatus.textContent = "Прогресс восстановлен.";
    } catch (error) {
      backupStatus.textContent = "Восстановление не выполнено: " + error.message;
    }
  });

  $("close-backup").addEventListener("click", () => settings.close());

  $("reset-data").addEventListener("click", () => {
    const answer = prompt(
      "Все данные LifeGame в этом браузере будут сброшены: " +
      "задания, квесты, цели, покупки, планы, монеты и алмазы.\n\n" +
      "Вернутся восемь стартовых блоков. Внешние копии не изменятся.\n\n" +
      "Для подтверждения введи СБРОС:"
    );
    if (answer === null) return;
    if (answer.trim().toUpperCase() !== "СБРОС") {
      backupStatus.textContent = "Сброс отменён.";
      return;
    }
    try {
      const clean = emptyState();
      ensureDay(clean);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalize(clean)));
      window.location.reload();
    } catch (error) {
      backupStatus.textContent = "Сброс не выполнен: " + error.message;
    }
  });

  document.querySelectorAll(".nav-button").forEach(node => {
    node.addEventListener("click", () => go(node.dataset.page));
  });

  function refreshVisible() {
    if (document.hidden || !healthy) return;
    if (loadLatest()) syncDay();
    render();
    runEffect();
  }
  document.addEventListener("visibilitychange", refreshVisible);
  window.addEventListener("storage", event => {
    if (event.key === STORAGE_KEY || event.key === null) refreshVisible();
  });
  setInterval(() => {
    if (!document.hidden && healthy && state.dayPlanDate !== today()) {
      refreshVisible();
    }
  }, 30000);

  // Инициализация только после объявления всех переменных.
  if (loadLatest()) syncDay();
  render();
})();
</script>
</body>
</html>
