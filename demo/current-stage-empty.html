<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LifeGame — пустой текущий этап</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;background:#000;color:#f3f3f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #ffe579;outline-offset:4px}
.stage{width:100%;max-width:356px;overflow:hidden;position:relative;border:1px solid #65562b;border-radius:23px;background:radial-gradient(ellipse at 88% 0,rgba(255,214,74,.045),transparent 55%),linear-gradient(145deg,#202020,#161616 70%);box-shadow:0 12px 60px #ffd54a06}
.head{display:flex;align-items:center;justify-content:space-between;padding:23px 22px 0;gap:14px}.eyebrow{display:flex;align-items:center;gap:8px;color:#aaa38b;font-size:9px;letter-spacing:1.8px;font-weight:500}.dot{width:5px;height:5px;border-radius:50%;background:#ffda55;box-shadow:0 0 9px #ffd54a70}.head h1{font-size:25px;letter-spacing:-.7px;line-height:1.15;margin:9px 0 0;font-weight:650}.more{align-self:flex-start;margin:-3px -9px 0 0;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:#a5a5a0;border-radius:12px}.more svg{width:20px;height:20px}
.context{padding:23px 22px 0}.context-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#ffffff02;border:1px solid #ffffff0c;border-radius:13px;padding:13px 12px;color:inherit}.context-row+.context-row{margin-top:9px}.symbol{width:29px;height:29px;flex:none;border:1px solid #ffffff0d;border-radius:9px;display:grid;place-items:center;color:#f19aaa;background:#f19aaa14;border-color:#f19aaa38}.symbol svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.goal .symbol{color:#8fb7ff;background:#8fb7ff14;border-color:#8fb7ff38}.copy{flex:1;min-width:0}.copy strong{display:block;font-size:12px;font-weight:550;line-height:1.4}.copy small{display:block;margin-top:4px;color:#91918a;font-size:10px;line-height:1.4}.plus{color:#93928a;flex:none;font-size:19px;font-weight:300;line-height:1}
.steps{margin:24px 22px 0;padding-top:22px;border-top:1px solid #ffffff0b}.steps h2{font-size:14px;line-height:1.4;margin:0;font-weight:550;letter-spacing:-.15px}.steps p{font-size:11px;line-height:1.6;color:#a5a59b;margin:7px 0 17px;max-width:250px}.add{width:100%;min-height:47px;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border-radius:12px;background:#ffda4e;border:1px solid #ffe480;color:#171407;font-size:12px;font-weight:650;box-shadow:0 3px 18px #ffd54a13}.add span{font-size:20px;font-weight:400;line-height:12px}.add:hover{background:#ffe16b}.context-row:hover{border-color:#ffffff22;background:#ffffff04}
.footer{margin:23px 22px 0;padding:18px 0 21px;border-top:1px solid #ffffff0b}.footer p{margin:0 0 11px;text-align:center;font-size:10px;line-height:1.5;color:#898982}.next{display:flex;width:100%;min-height:45px;align-items:center;justify-content:center;gap:9px;border:1px solid #ffffff20;border-radius:12px;background:#ffffff03;color:#c6c6bd;text-align:center;font-size:11px;font-weight:550;padding:11px 14px}.next svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;color:#a7ac9b}.next:hover{background:#ffffff07;border-color:#ffffff38;color:#f0f0e9}
@media(max-width:340px){.head{padding-inline:18px}.context{padding-inline:18px}.steps,.footer{margin-inline:18px}.copy small{font-size:9.5px}}
</style>
</head>
<body>
<article class="stage" aria-label="Пустой текущий этап">
 <header class="head"><div><div class="eyebrow"><span class="dot" aria-hidden="true"></span>ЭТАП 01</div><h1>Сейчас</h1></div><button class="more" type="button" aria-label="Настроить этап"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></header>
 <div class="context">
  <button class="context-row" type="button"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.5 5.5c-2-2-5.4-1.8-8.5 1.5-3.1-3.3-6.5-3.5-8.5-1.5-2.6 2.6-1.5 6 1 8.5l7.5 7 7.5-7c2.5-2.5 3.6-5.9 1-8.5Z"/></svg></span><span class="copy"><strong>Добавить смысл</strong><small>Почему это важно для тебя?</small></span><span class="plus" aria-hidden="true">+</span></button>
  <button class="context-row goal" type="button"><span class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 22V3c5-4 9 4 15 0v11c-6 4-10-4-15 0"/></svg></span><span class="copy"><strong>Добавить цель</strong><small>К какому результату хочешь прийти?</small></span><span class="plus" aria-hidden="true">+</span></button>
 </div>
 <section class="steps" aria-labelledby="steps-title"><h2 id="steps-title">С чего начнёшь?</h2><p>Добавь первое небольшое дело —<br>это уже шаг вперёд.</p><button class="add" type="button"><span aria-hidden="true">+</span>Добавить задание</button></section>
 <footer class="footer"><p>Готов двигаться дальше?</p><button class="next" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/></svg>Завершить этап</button></footer>
</article>
</body>
</html>
